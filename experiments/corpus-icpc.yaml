# All tools on the 23 projects of the ICPC 2026 paper, pinned at their HEAD of 2026-10-18 (experiments/corpus/icpc-2026.yaml).
# Held-out counterpart of corpus-pilot-small. Large repos (bisq, bisq2, Chat2DB, paperless-ngx) push CBOMkit towards its
# timeout. The current spec runs the 11 eligible tools (cdxgen in Go only).
#   make experiment EXP=experiments/corpus-icpc.yaml
#   make experiment-export NAME=corpus-icpc        # runs the analysis report first
name: corpus-icpc
description: ICPC 2026 paper repositories rerun through BF-CBOM at today's commits (held out from all tuning)
tools: [cbomkit, cdxgen, cipherradar, ciphersift, cryptobomforge, cryptoscan, pqcheck, qdarpan, scanoss, securin-xbom, xgrep]  # the bar exam of 2026-10-31 (bar-micro export) passed 12, of which cbomkit-jar is left out (CBOMkit runs as its server distribution, decided 2026-10-30); cryptarium, qelens, qscan failed the bar
tool_languages:  # cdxgen is eligible in Go only (9 of 14); in Java it is below the bar (0: its Java algorithms carry no location), Python is not one of its languages
  cdxgen: [go]
repetitions: 1
corpus: corpus/icpc-2026.yaml
