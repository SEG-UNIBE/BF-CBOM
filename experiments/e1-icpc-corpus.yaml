# All tools on the 23 projects of the ICPC 2026 paper, pinned at their HEAD of 2026-10-18 (corpus/icpc-2026.yaml).
# Held-out counterpart of e1-pilot-corpus. Large repos (bisq, bisq2, Chat2DB, paperless-ngx) push CBOMkit towards its
# timeout; DeepSeek calls the API on every repo (costs tokens).
#   make experiment EXP=experiments/e1-icpc-corpus.yaml
#   make experiment-export NAME=e1-icpc-corpus        # runs the analysis report first
name: e1-icpc-corpus
description: ICPC 2026 paper repositories rerun through BF-CBOM at today's commits (held out from all tuning)
tools: [cbomkit, cdxgen, cryptobomforge, cryptoscan, deepseek, pqcheck, qdarpan, securin-xbom, cipherradar, xgrep, cbomkit-jar, ciphersift, scanoss]
repetitions: 1
corpus: ../corpus/icpc-2026.yaml
