# The paper's corpus run (RQ1-RQ4): the stratified GitHub sample of 2026-10-30, 6 repos per (star bin x size bin)
# cell, 54 each in Java, Python and Go, the eligible tools once. 1620 tool/repository pairs, 1242 of them supported
# (Java 7 tools, Python 8, Go 8); the rest are recorded as unsupported without scanning.
# Run on the VM after make up-prod, once bar-micro has confirmed the tools on the pins of 2026-10-30:
#   make experiment EXP=experiments/corpus-main.yaml EXPERIMENT_MEMORY_BUDGET_GB=0 ARGS="--overwrite-old"
#   make experiment-export NAME=corpus-main BF_CBOM_JOBS=32 RUNNER_MEMORY=96g
name: corpus-main
description: stratified GitHub sample of 2026-10-30, 54 repos each in Java, Python and Go
tools: [cbomkit, cipherradar, ciphersift, cryptobomforge, cryptoscan, pqcheck, qdarpan, scanoss, securin-xbom, xgrep]  # the eligible tools of the bar exam (cbomkit-jar left out: CBOMkit runs as its server distribution); cdxgen, cryptarium, qelens, qscan disqualified
repetitions: 1
corpus: corpus/corpus-pc6.yaml
