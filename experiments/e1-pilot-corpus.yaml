# All tools on the 16 real projects of the pilot (2026-10-08), at the pinned commits (corpus/pilot-2026-10-08.yaml).
# Several repos are large (Kafka, Keycloak, Vault, curl): expect CBOMkit runs of 5-30 min each and
# raise WORKER_TIMEOUT_SEC / memory for worker-cbomkit before running (pilot: 45 min, 16 GB heap).
#   make experiment EXP=experiments/e1-pilot-corpus.yaml
#   make analysis ARGS="sites e1-pilot-corpus"
name: e1-pilot-corpus
description: pilot corpus rerun through BF-CBOM (location-aware agreement across tools)
tools: [cbomkit, cdxgen, cryptobomforge, cryptoscan, deepseek, pqcheck, qdarpan, securin-xbom, cipherradar, xgrep, cbomkit-jar, ciphersift, scanoss, qelens, cryptarium, qscan]
repetitions: 1
corpus: ../corpus/pilot-2026-10-08.yaml
