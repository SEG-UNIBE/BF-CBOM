# vocabulary, the adapter specs or CipherSift (unlike experiments/corpus/pilot-2026-10-08.yaml, the development set).
# Format as experiments/corpus/pilot-2026-10-08.yaml; `expect_crypto` is metadata for the analysis, ignored by the runner:
# `low` = probably little or no crypto in first-party source (negative cases; refinement 11 would exclude them
