# The 12 real projects of the pilot experiment (2026-10-08) in the paper languages (Java, Python, Go), pinned to the
# commits scanned then. The pilot also scanned panva/jose (TypeScript), openssh/openssh-portable (C), curl/curl (C) and
# parse-community/parse-server (JavaScript), removed 2026-10-20 as not paper languages; all 16 are in
# pilot-2026-10-08-all.yaml, which CipherSift's `tailored_on` reads (it was tuned on all of them).
# Format: a corpus file for experiment specs (`corpus: corpus/pilot-2026-10-08.yaml`, see
# experiments/README.md). The `pilot_*` keys are metadata for the analysis and are ignored by the runner.
# The four short hashes recorded for the native corpus were resolved to full SHAs against the
# upstream tags on 2026-10-15 (git ls-remote <tag>^{}).
