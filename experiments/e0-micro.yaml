# The voter bar: every tool once on the hand-written micro projects (corpus/micro, 11 known crypto calls per language,
# corpus/micro/ground_truth.yaml). A tool is a voter if it finds at least 6 of the 11 at their lines on one paper
# language's project (Java, Python, Go); below it, `role: observer` in common/tools.yaml. The directories are
# published to the git server as deterministic fixture commits (`path:`), so every worker scans them like any repo.
#   make experiment EXP=experiments/e0-micro.yaml ARGS="--overwrite-old" EXPERIMENT_MEMORY_BUDGET_GB=0
#   make analysis ARGS="micro e0-micro"      # the inclusion check per tool and language (also in report's _SUMMARY.md)
# After a change to one worker: ARGS="--rerun <tool>" (5 jobs).
name: e0-micro
description: "the voter bar: every tool once on the five micro projects with known ground truth"
tools: [cbomkit, cdxgen, cryptobomforge, cryptoscan, deepseek, pqcheck, qdarpan, securin-xbom, cipherradar, xgrep, cbomkit-jar, ciphersift, scanoss, qelens, cryptarium, qscan]
repetitions: 1
repos:
  - full_name: bfcbom/micro-java
    path: ../corpus/micro/java
    language: Java
  - full_name: bfcbom/micro-python
    path: ../corpus/micro/python
    language: Python
  - full_name: bfcbom/micro-go
    path: ../corpus/micro/go
    language: Go
  - full_name: bfcbom/micro-javascript
    path: ../corpus/micro/javascript
    language: JavaScript
  - full_name: bfcbom/micro-c
    path: ../corpus/micro/c
    language: C
