# All tools on the pilot's 12 real projects in the paper languages (Java, Python, Go), at the pinned commits
# (experiments/corpus/pilot-2026-10-08.yaml).
# Several repos are large (Kafka, Keycloak, Vault): expect CBOMkit runs of 5-30 min each and
# raise WORKER_TIMEOUT_SEC / memory for worker-cbomkit before running (pilot: 45 min, 16 GB heap).
#   make experiment EXP=experiments/corpus-pilot-small.yaml ARGS="--overwrite-old" EXPERIMENT_MEMORY_BUDGET_GB=0
#   make analysis ARGS="report corpus-pilot-small"
name: corpus-pilot-small
description: pilot corpus rerun through BF-CBOM (location-aware agreement across tools), paper languages only
tools: [cbomkit, cdxgen, cipherradar, ciphersift, cryptobomforge, cryptoscan, pqcheck, qdarpan, scanoss, securin-xbom, xgrep]  # the bar exam of 2026-10-31 (bar-micro export) passed 12, of which cbomkit-jar is left out (CBOMkit runs as its server distribution, decided 2026-10-30); cryptarium, qelens, qscan failed the bar
tool_languages:  # cdxgen is eligible in Go only (9 of 14); in Java it is below the bar (0: its Java algorithms carry no location), Python is not one of its languages
  cdxgen: [go]
repetitions: 1
corpus: corpus/pilot-2026-10-08.yaml
