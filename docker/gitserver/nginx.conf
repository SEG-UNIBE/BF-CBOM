worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log /dev/stdout;
    client_max_body_size 0;
    sendfile on;

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        ssl_certificate     /certs/gitserver.crt;
        ssl_certificate_key /certs/gitserver.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Smart HTTP for /<owner>/<repo>.git/... and, for clients that strip the suffix (CBOMkit),
        # /<owner>/<repo>/... -> same bare repository.
        location ~ "^/(?<owner>[^/]+)/(?<repo>[^/]+?)(\.git)?(?<rest>/(info/refs|git-upload-pack|HEAD|objects/.*))$" {
            fastcgi_pass unix:/run/fcgiwrap.sock;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
            fastcgi_param GIT_PROJECT_ROOT /srv/git;
            fastcgi_param GIT_HTTP_EXPORT_ALL "";
            fastcgi_param PATH_INFO /$owner/$repo.git$rest;
            fastcgi_read_timeout 900s;
            # stream upload-pack to the client instead of spooling multi-GB packs into temp files
            fastcgi_buffering off;
        }

        location / { return 404; }
    }
}
