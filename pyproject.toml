[project]
name = "bf-cbom"
version = "1.0.3"
description = "A comprehension-centric framework for analyzing Cryptography Bill of Material (CBOMs) generated by various tools. Compare CBOM outputs side-by-side, explore detected cryptographic assets, and orchestrate end-to-end benchmarks across containerized generators. In essence, your best friend for understanding the cryptographic posture of your software."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Roman Bögli", email = "roman.boegli@unibe.ch" },
    { name = "Jonas Spieler" },
    { name = "Timo Kehrer" }
]
requires-python = ">=3.12"
dependencies = [
    "dataclasses-json>=0.6.7",
    "openai>=1.102.0",
    "redis>=6.4.0",
    "streamlit>=1.49.0",
    "tqdm>=4.67.1",
    "websocket-client>=1.8.0",
    "typer>=0.12.5",
    "pyyaml>=6.0.2",
    # the mutation harness (mutation/lang.py) parses Java and Go; Python uses its own `ast`
    "tree-sitter>=0.26.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-go>=0.25.0",
    # the CLI's live progress (misc/cli/progress.py); typer depends on it too
    "rich>=14.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
# experiments/corpus/micro: generated by mutation/micro.py, its ground truth names exact line numbers; never reformat
extend-exclude = ["experiments/corpus/micro"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W605"]

[tool.ruff.lint.isort]
known-first-party = ["common", "coordinator", "workers", "misc", "analysis"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.optional-dependencies]
# RaQuN (analysis/matchers/raqun.py in the runner, and the UI's similarity worker misc/pyqun): the PyQuN package from
# the user's fork, pinned by its tag in [tool.uv.sources] (uv.lock records the commit).
raqun = ["pyqun"]
# The UI's "Find Similar Components" (misc/pyqun): MiniLM embeddings; only the misc-pyqun image installs it (torch).
similarity = ["sentence-transformers>=6.2.0"]

[tool.uv]
package = true

[tool.uv.sources]
pyqun = { git = "https://github.com/RomanBoegli/PyQuN", tag = "v1.0.1" }

[dependency-groups]
dev = [
    "fakeredis>=2.26",  # the runner's integration test (tests/test_runner.py)
    "black>=25.1.0",
    "jsonschema>=4.25.1",
    "referencing>=0.36.2",  # schema registry for the offline CycloneDX validation (analysis/schema.py)
    "pytest>=8.4.1",
    "ruff>=0.12.11",
    "watchdog>=6.0.0",
    "cryptography>=50.0.2",  # tests/test_mutation.py runs the catalog's pyca snippets
]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "coordinator*", "workers*", "misc*", "analysis*", "mutation*"]
exclude = ["docker*", "tests*", "scripts*"]

[project.scripts]
bf-cbom = "misc.cli:app"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
