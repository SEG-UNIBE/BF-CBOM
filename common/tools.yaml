# Engine / rule-set families of the CBOM generators (BF-CBOM 2.0, Phase 2 "engine independence").
#
# Tools sharing their detection logic (an engine, or a rule set) have one `voter_group` and count as one voter in
# the agreement-based rates (RQ3; default: the tool itself; evidence per group in analysis/README.md "Voter
# groups"). `merge_group` names a coarser voter the sensitivity analysis can merge them into (`--merge-llm`: the LLM
# workers, which share prompts and file selection, decided 2026-10-18); `engine_family` marks tools that share only a
# pattern engine but run independently written rules (decided 2026-10-20 after the rule-overlap check): separate
# voters, merged for the `engine-merged` ranking of grouping-run<k>.csv. `cbom_by` says who writes the CBOM document:
# `tool` (the tool itself; our worker adapter at most moves a tool's own values into standard fields) or `bf-cbom` (our
# worker assembles it, the LLM workers), whose validity measures us, not the tool (refinement 3); the format is read
# from each document (bomFormat, specVersion). `languages` is the tool's declared
# scope: a repo in another language is "not supported", never "failed" (pilot recommendation).
#   A spec narrows a tool further by hand (`tool_languages:` in experiments/<spec>.yaml, e.g. after reading the
#   bar-micro report); nothing here is derived from the bar exam.
# `status`: integrated (worker exists) | candidate (passed the pilot's inclusion bar, worker pending)
#          | blocked (needs access, see CLAUDE.md) | excluded (failed the bar; kept for RQ1/RQ2 only)
#          | prepared (worker ready, but kept out of AVAILABLE_WORKERS and the specs until its source is public).
# `role`: voter (default) | observer (transitional until the bar-micro rerun; decided 2026-10-19: tools that
#   failed the colleague's pilot bar are run and
#   analysed like every tool, and the panel confirms their findings, but they never confirm another tool, never count
#   in k, exclusivity or Dawid-Skene and are never ranked; `--observers-vote` makes them voters, the sensitivity check).
# Pilot verdicts (2026-10-08, docs/pilot-2026-10-08/README.md): pass/borderline/fail per language.
# `micro_<date>`: lenient call-site recall on the micro projects (measured on bar-micro:
#   `make analysis ARGS="micro bar-micro"`; the entry bar is half the items in one paper language: 6/11 on the
#   hand-written projects up to 2026-10-21, 7/14 on the generated ones since 2026-10-22; below it in every language
#   a tool is `disqualified`);
#   scored from the normalised records since 2026-10-18.
# `memory_gb`: the worker's compose memory limit (docker-compose.yml, kept equal by a test); the batch
#   runner sums it over the tools it feeds at once to stay within EXPERIMENT_MEMORY_BUDGET_GB (waves).
tools:
  cbomkit:
    micro_2026-10-17: {java: 11/11, python: 5/11, go: 8/11}
    engine: sonar-cryptography      # IBM/PQCA sonar-cryptography plugin; the action jar and the server image share it
    memory_gb: 16
    approach: syntax tree + resolution of provider strings (JCA, BouncyCastle, pyca/cryptography, Go std)
    cbom_by: tool
    languages: [java, python, go]   # 2.1.10 had no Go analyser (0/11 on micro-go); 2.3.0 has the action jar's engine
    voter_group: cbomkit            # one voter together with cbomkit-jar (same sonar-cryptography engine)
    status: integrated              # server image ghcr.io/cbomkit/cbomkit 2.3.0 (sonar-cryptography 1.7.0, same engine as cbomkit-jar)
    pilot: {java: pass, python: pass, go: pass}
    notes: >
      Python support is pyca/cryptography only (hashlib/hmac/ssl out of scope by design). Module indexing
      bug: a directory counts as a module only with a build file AND src/; Kafka-like layouts silently scan a
      handful of files (pilot added an empty src/). Invents key sizes ("AES-128", "RSA-2048") and sometimes
      labels PEM headers as algorithms. Pilot runs used 45 min and -Xmx16g.
  cbomkit-jar:
    micro_2026-10-17: {java: 11/11, python: 5/11, go: 8/11}
    engine: sonar-cryptography      # cbomkit-action v2.3.0 jar (cbomkit-lib 1.3.0, sonar-cryptography 1.7.0): the packaging the pilot graded
    memory_gb: 8
    approach: syntax tree + resolution of provider strings (JCA, BouncyCastle, pyca/cryptography, Go std)
    cbom_by: tool
    languages: [java, python, go]
    voter_group: cbomkit            # one voter together with cbomkit; a separate tool in every other table
    status: integrated              # workers/cbomkit-jar; source-only scan (CBOMKIT_JAVA_REQUIRE_BUILD=false), CBOMKIT_LANGUAGES from the repo language
    pilot: {java: pass, python: pass, go: pass}
  cdxgen:
    # role pending (2026-10-21): below the bar on these numbers, but its Go locations are read only since 2026-10-20
    # (it found the inserted RSA keygen at its line in all three Go mutants of mutation-smoke); the next bar-micro
    # decides: at least 7/14 in one language on the generated projects keeps it a voter, else `role: observer`
    micro_2026-10-17: {java: 0/11, python: 0/11, go: 0/11, javascript: 4/11}
    engine: cdxgen
    memory_gb: 16                   # 4 OOM-killed Gradle on bisq/bisq2 (2026-10-18); 8 still OOM-killed on Chat2DB, bisq, bisq2, kafka (2026-10-19)
    approach: dependency manifests + evidence (atom); crypto output is mostly libraries and certificates
    cbom_by: tool
    languages: [java, python, javascript, go]   # crypto locations: JS/TS occurrences and Go sourceLocation properties
    status: integrated              # image 12.8.5 (11.7.0 found nothing on any micro project)
    notes: >
      Algorithms with file/line for JS/TS (occurrences) and Go (cdx:golem:crypto:sourceLocation, one per asset).
      Python algorithms have no locations; Java's atom analysis has no crypto-generate sinks and yields none.
      The worker passes --include-crypto --evidence and -t python / -t go for those languages. Go analysis needs
      resolvable imports, network and a writable module cache; each job has its own GOPATH since 2026-10-22.
      Earlier Go runs need to be redone. See docs/findings.md for the fixture and worker setup fixes.
    pilot: {java: fail, python: fail}   # no file/line for crypto findings; RQ1/RQ2 only
  cryptobomforge:
    micro_2026-10-17: {python: 8/11, c: 8/11}   # read from its IBM-draft windows since 2026-10-18 (before: 0/11, the call-site extraction did not read them)
    engine: codeql                  # Santander cryptobom-forge on CodeQL crypto queries
    memory_gb: 6
    approach: data flow (CodeQL)
    cbom_by: tool                   # its own IBM pre-standard draft `1.4-cbom-1.0` (bomFormat CBOM, type crypto-asset), not CycloneDX
    languages: [python, c]          # upstream CodeQL crypto queries exist for Python and C/C++ only (no Java query)
    status: integrated              # runs experimental/cryptography/inventory/new_models (before 2026-10-17: CodeQL's default security suite by mistake)
    pilot: {java: fail, python: fail}   # exact line lost, algorithms relabelled; RQ1 (non-conformance example) and RQ2 only
  deepseek:
    micro_2026-10-17: {java: 11/11, python: 11/11, go: 11/11, javascript: 11/11, c: 9/11}
    engine: llm                     # provider adapters share prompts and file selection (common/llm_cbom.py, Phase 2)
    memory_gb: 1
    approach: LLM reading pre-filtered source files
    cbom_by: bf-cbom                # assembled by the worker from the model's structured answer
    languages: [java, python, go, javascript, c]
    voter_group: deepseek           # each LLM is its own voter; `--merge-llm` merges them into `merge_group`
    merge_group: llm
    status: integrated
    pilot: {java: fail, python: fail}   # graded on the OLD url-only worker (no code, no locations); superseded by the rewrite
  chatgpt:
    engine: llm
    memory_gb: 1
    approach: LLM reading pre-filtered source files (same prompts and file selection as deepseek)
    cbom_by: bf-cbom                # assembled by the worker from the model's structured answer
    languages: [java, python, go, javascript, c]
    voter_group: chatgpt
    merge_group: llm
    status: integrated              # needs OPENAI_API_KEY (compose profile llm)
  claude:
    engine: llm
    memory_gb: 1
    approach: LLM reading pre-filtered source files (same prompts and file selection as deepseek)
    cbom_by: bf-cbom                # assembled by the worker from the model's structured answer
    languages: [java, python, go, javascript, c]
    voter_group: claude
    merge_group: llm
    status: integrated              # needs ANTHROPIC_API_KEY (compose profile llm)
  cryptoscan:
    engine: cryptoscan               # CSNP CryptoScan 1.4.0, regex pattern catalogue (90+ patterns)
    memory_gb: 2
    approach: patterns
    cbom_by: tool                   # `--format cbom` emits CycloneDX 1.6 with evidence.occurrences
    languages: [java, python, go, javascript, typescript, c, cpp, rust, csharp, ruby, php]
    status: integrated
    micro_2026-10-17: {java: 9/11, python: 10/11, go: 10/11, javascript: 9/11, c: 1/11}   # record-based scoring (2026-10-18), strict the same; 2026-10-15 (0/0/5/6/0) was our setup error (no --include-quantum-safe, demo/ folder)

  # ---- passed the pilot's inclusion bar (2026-10-08); workers added 2026-10-15 (provenance: docs/pilot-2026-10-08/README.md)
  pqcheck:
    micro_2026-10-17: {python: 8/11, go: 8/11}
    engine: pqcheck                 # github.com/Rafael-Ryu/pqcheck 0.1.0 (Apache-2.0), tree-sitter + go/types
    memory_gb: 4
    approach: syntax tree (tree-sitter), Go via go/types when a Go toolchain is present
    cbom_by: tool
    languages: [python, go]
    status: integrated             # workers/pqcheck
    pilot: {python: pass, go: pass}
  qdarpan:
    micro_2026-10-17: {java: 11/11, go: 9/11, c: 7/11}
    engine: q-darpan                # github.com/RohanExploit/q-darpan 72a4edd (Apache-2.0), tree-sitter
    memory_gb: 4
    approach: syntax tree (tree-sitter)
    cbom_by: tool                   # CycloneDX 1.7, but locations only in custom properties qdarpan:location.N (adapter moves them to evidence.occurrences)
    languages: [java, go, c]
    status: integrated             # workers/qdarpan
    pilot: {java: pass, go: pass, c: pass}
  securin-xbom:
    micro_2026-10-17: {java: 9/11, python: 8/11}   # with the frozen registry rule sets (2026-10-15 without them: 6/11, 7/11)
    engine: semgrep-rules           # github.com/securin-public/securin-xbom a270c5f (Apache-2.0), ~13 semgrep rule files
    memory_gb: 4
    approach: patterns (semgrep)
    cbom_by: tool
    languages: [java, python]
    voter_group: securin-xbom       # own voter: its semgrep-registry rules share no rule with CipherRadar's (analysis/README.md "Voter groups")
    engine_family: semgrep          # semgrep engine; CipherRadar and SCANOSS run opengrep, its fork
    status: integrated             # workers/securin-xbom
    pilot: {java: pass, python: pass, go: fail, c: fail, javascript: fail}
    notes: runs offline with the semgrep.dev rule sets it fetches online (r/java.lang.security, r/python.cryptography) frozen at a pinned semgrep-rules commit, unfiltered; before 2026-10-17 offline mode silently dropped them. Its cdxgen layer is broken with cdxgen 12
  cipherradar:
    micro_2026-10-17: {java: 11/11, python: 8/11, go: 9/11, javascript: 9/11}   # its C families are guesses (C is outside its languages)
    engine: opengrep-rules          # github.com/nk-sentinel/cipherradar efa5d9d, opengrep rules + tree-sitter + YARA
    memory_gb: 4
    approach: patterns (opengrep) + syntax tree
    cbom_by: tool                   # CycloneDX 1.7
    languages: [java, python, go, javascript]   # Java: nil-pointer crash on `new ECGenParameterSpec(<identifier>)` (jjwt, Keycloak) is worked around in the worker (files with the trigger pre-excluded via .cradarignore, recorded in the notes; the tool itself is not patched)
    voter_group: cipherradar        # own voter: its rules share no rule with securin-xbom's or SCANOSS's (3 bare API names in Go)
    engine_family: semgrep          # opengrep (a semgrep fork) for its rule pass, plus tree-sitter and YARA-X passes
    status: integrated             # workers/cipherradar
    pilot: {java: borderline, python: pass, go: pass, javascript: pass, c: fail}
    notes: very noisy solo findings (17-31 % precise when alone in the pilot); needs writable XDG_* dirs or opengrep dies silently

  ciphersift:
    micro_2026-10-17: {java: 11/11, python: 11/11, go: 11/11}   # tailored on these projects, see tailored_on
    engine: ciphersift              # CipherSift v1.2.0 (SEG-UNIBE, Apache-2.0): clean-room reimplementation of the approach of Crypsy (Näther & Hirsch, arXiv 2608.04857) for Java, Python and Go
    memory_gb: 4
    approach: syntax tree (tree-sitter) + YAML rules (name and constant resolution, wrapper propagation)
    cbom_by: tool                   # CycloneDX 1.7, family in algorithmProperties.algorithmFamily
    languages: [java, python, go]
    voter_group: ciphersift
    status: integrated              # workers/ciphersift; release pinned in docker/Dockerfile.worker-ciphersift
    tailored_on: [experiments/corpus/micro, experiments/corpus/pilot-2026-10-08-all.yaml]   # paths from the repo root; benchmark-informed rules and defaults (its spec/DECISIONS.md): no held-out data for it
    notes: >
      Written from a behavioural specification of Crypsy; its Java/Python rules were converted from the earlier BF-CBOM
      Crypsy adaptation (spec/PROVENANCE.md). Also lists crypto libraries from Maven/Gradle, PyPI and Go manifests.
      Non-crypto PRNGs are reported only with --weakness-indicators (off here); unresolved Java algorithm strings
      give *.unresolved components without a family. No inter-procedural data flow beyond constants and wrappers.

  # ---- integrated 2026-10-17 with its public open rules; its full rule set (Java, Python) needs a SCANOSS API key
  scanoss:
    micro_2026-10-17: {go: 10/11, javascript: 3/11, c: 7/11}   # open rules (2 JavaScript rule files); Java/Python unsupported without a key
    engine: opengrep-rules          # SCANOSS crypto-finder 0.37.1 on opengrep 1.22.0, rules scanoss/open-crypto-rules@c5f32b7b
    memory_gb: 4
    approach: patterns (opengrep) + call graph
    cbom_by: tool                   # `--format cyclonedx`; declares CycloneDX 1.7 (its docs still say 1.6)
    languages: [go, c, javascript, rust]   # what the open rules cover; Java/Python rules only through the API with a key
    voter_group: scanoss            # own voter: scanoss/open-crypto-rules share no rule with CipherRadar's (3 bare API names in Go)
    engine_family: semgrep          # opengrep (a semgrep fork)
    status: integrated              # workers/scanoss; binary, opengrep and rules commit pinned in docker/Dockerfile.worker-scanoss
    pilot: {go: pass, c: pass, javascript: fail, java: "?", python: "?"}   # open rules only; Java/Python rules not available
    notes: >
      Offline with --no-remote-rules --rules-dir (the documented mode without a key), otherwise its defaults: test
      sources and vendor dirs excluded, call graph built. Rules detect terminal crypto operations only. AES
      parameterSetIdentifier is the key length in bytes (32 for AES-256), not bits as CycloneDX defines it. A
      committed scanoss.json in a scanned repo sets skip patterns (recorded in the run notes).
  xgrep:
    micro_2026-10-17: {java: 11/11, python: 10/11, go: 10/11, javascript: 9/11}
    engine: mondoo-xgrep            # proprietary binary (free of charge) from the public npm package, pinned 0.86.0
    memory_gb: 4
    approach: syntax tree + data flow
    cbom_by: tool
    languages: [java, python, go, javascript]
    status: integrated              # workers/xgrep
    pilot: {java: pass, python: pass, go: pass, javascript: pass}
  # ---- blocked on access (CLAUDE.md, Phase 2)
  cryptoscope:
    engine: ibm-cryptoscope
    approach: data flow
    cbom_by: unknown
    languages: [java]
    status: blocked

  # ---- observers (integrated 2026-10-19): failed the pilot's inclusion bar on every language tested, which rested on
  # the AI-made micro ground truth; their data is harvested, they do not vote (`role`, above)
  qelens:
    engine: qelens                  # qelens/cbom (ex keylens, MPL-2.0), crate `cbom` 0.1.2
    memory_gb: 4
    approach: syntax tree (tree-sitter), dependency lockfiles
    cbom_by: tool                   # `--format cyclonedx` (specVersion 1.6; its docs say 1.5)
    languages: [python, javascript] # its SUPPORTED_LANGUAGES.md; Rust only through Cargo.lock
    status: integrated              # workers/qelens; release pinned in docker/Dockerfile.worker-qelens
    role: observer
    pilot: {java: borderline, python: fail, go: fail, c: fail, javascript: fail}
  cryptarium:
    engine: cryptarium              # sgoveia/cryptarium v0.3.0 (Apache-2.0)
    memory_gb: 4
    approach: syntax tree (tree-sitter) + YAML rule packs (embedded); also certificates, keys, nginx/SSH/JWT configs
    cbom_by: tool
    languages: [java, python, go, javascript, c]
    status: integrated              # workers/cryptarium; release tag pinned in docker/Dockerfile.worker-cryptarium
    role: observer
    pilot: {java: fail, python: fail, go: fail, c: fail, javascript: fail}
  qscan:
    engine: qscan                   # quantakrypto/pqc-tools, npm @quantakrypto/qscan 0.12.0 (Apache-2.0)
    memory_gb: 4
    approach: patterns (own TypeScript detectors); dependency manifests, keys, TLS and IaC configs
    cbom_by: tool                   # `--format cbom` (CycloneDX 1.6)
    languages: [java, python, go, javascript, c, rust, csharp, ruby, php]   # of its 14 claimed languages, those in our list
    status: integrated              # workers/qscan; npm release pinned in docker/Dockerfile.worker-qscan
    role: observer
    pilot: {java: fail, python: fail, go: fail, c: fail, javascript: fail}
    notes: offline by default; the optional LLM triage (--triage) and supply-chain audit (--audit) are never enabled

  # ---- not integrated: pqc-mat (decided 2026-10-19). Its code scanner VECTOR-Code (AbstractionsLab/pqc-mat, AGPL-3.0)
  # runs CodeQL's crypto inventory queries and converts the SARIF with cryptobom-forge: the engine of our
  # cryptobomforge worker, repackaged (the pilot's -2 line offset is cryptobom-forge's context window). Failed the pilot.
  # ---- not integrated by decision (2026-10-17)
  # OQS Scanner (jimbo111/open-quantum-secure, MIT): an orchestrator over third-party engines (semgrep, ast-grep,
  # cipherscope; optionally CryptoScan and cdxgen); failed the pilot, passed the coworker's audit (micro 11/9/11)
