# Engine / rule-set families of the CBOM generators (BF-CBOM 2.0, Phase 2 "engine independence").
#
# Tools sharing their detection logic (an engine, or a rule set) have one `voter_group` and count as one voter in
# the agreement-based rates (RQ4; default: the tool itself; evidence per group in analysis/README.md "Voter
# groups"). `merge_group` names a coarser voter the sensitivity analysis can merge them into (`--merge-llm`: the LLM
# workers, which share prompts and file selection, decided 2026-10-18); `engine_family` marks tools that share only a
# pattern engine but run independently written rules (decided 2026-10-20 after the rule-overlap check): separate
# voters, merged for the `engine-merged` ranking of grouping-run<i>.csv. `cbom_by` says who writes the CBOM document:
# `tool` (the tool itself; our worker adapter at most moves a tool's own values into standard fields) or `bf-cbom` (our
# worker assembles it, the LLM workers), whose validity measures us, not the tool (refinement 3); the format is read
# from each document (bomFormat, specVersion). `languages` is the tool's declared
# scope: a repo in another language is "not supported", never "failed" (pilot recommendation).
#   A spec narrows a tool further by hand (`tool_languages:` in experiments/<spec>.yaml, e.g. after reading the
#   bar-micro report); nothing here is derived from the bar exam.
# `status`: integrated (worker exists) | candidate (passed the pilot's inclusion bar, worker pending)
#          | blocked (needs access, see CLAUDE.md) | excluded (failed the bar; kept for RQ1/RQ2 only)
#          | prepared (worker ready, but kept out of AVAILABLE_WORKERS and the specs until its source is public).
# Every tool votes. The bar exam's verdicts are recorded in the bar-micro export only; nothing here records them.
# `packaging`: how the tool packages its findings, read from its CBOMs by hand (decided 2026-10-30), one of
#   `per hit` (one component per place), `per rule` (one component per rule match on one API, with its places),
#   `per algorithm` (one component per algorithm as the tool spells it, parameters included, with all its places),
#   `per family` (one component per coarse family, the specific algorithm only at the place), `no places` (no
#   evidence at all); `unknown` for a tool whose output nobody has read yet (the default). Shown in the summary's
#   "Units per tool" next to the measured signature (records per asset, assets per item); never derived from it.
# `approach`, `vendor`, `url`, `shipped`: what the tool is built on (a third-party engine named first) and how it
#   detects, who publishes it, its project page and how it is shipped (CLI, server, GitHub Action, HTTP API); read
#   from the tools' own pages (2026-10-30), printed in the summary's "Tools" table (tools.csv).
# `version`, `version_url`: the version the paper reports, the tool's own (engines in docs/tool-versions.md): its
#   release, or the first 7 characters of the pinned commit when it has none; and the page that shows that version
#   (the release, else the tag, the commit or the package version), the paper's citation. Kept with the pin in
#   docker/Dockerfile.worker-<tool> (a test checks the Dockerfile names it); the summary's "Tool versions" table
#   links it and checks every run recorded it (tools.csv).
# `memory_gb`: the worker's compose memory limit (docker-compose.yml, kept equal by a test); the batch
#   runner sums it over the tools it feeds at once to stay within EXPERIMENT_MEMORY_BUDGET_GB (waves).
tools:
  cbomkit:
    engine: sonar-cryptography      # IBM/PQCA sonar-cryptography plugin; the action jar and the server image share it
    packaging: per algorithm    # one component per algorithm (name and parameter set), every occurrence listed
    memory_gb: 20                   # with -Xmx16g (compose JAVA_OPTS); 16 with -Xmx12g until 2026-10-30 (peak 12.8 on scapy)
    approach: "sonar-cryptography (SonarQube plugin): syntax tree + resolution of provider strings (JCA, BouncyCastle, pyca/cryptography, Go std)"
    vendor: PQCA (Linux Foundation)
    url: "https://github.com/cbomkit/cbomkit"
    version: "2.3.0"
    version_url: "https://github.com/cbomkit/cbomkit/releases/tag/2.3.0"
    shipped: server (REST API and web UI), Docker image
    cbom_by: tool
    languages: [java, python, go]   # 2.1.10 had no Go analyser (0/11 on micro-go); 2.3.0 has the action jar's engine
    voter_group: cbomkit            # one voter together with cbomkit-jar (same sonar-cryptography engine)
    status: integrated              # server image ghcr.io/cbomkit/cbomkit 2.3.0 (sonar-cryptography 1.7.0, same engine as cbomkit-jar)
    notes: >
      Python support is pyca/cryptography only (hashlib/hmac/ssl out of scope by design). Module indexing
      bug: a directory counts as a module only with a build file AND src/; Kafka-like layouts silently scan a
      handful of files (pilot added an empty src/). Invents key sizes ("AES-128", "RSA-2048") and sometimes
      labels PEM headers as algorithms. Pilot runs used 45 min and -Xmx16g.
  cbomkit-jar:
    engine: sonar-cryptography      # cbomkit-action v2.3.0 jar (cbomkit-lib 1.3.0, sonar-cryptography 1.7.0): the packaging the pilot graded
    packaging: per algorithm    # the same engine, the same packaging
    memory_gb: 8
    approach: "sonar-cryptography (SonarQube plugin): syntax tree + resolution of provider strings (JCA, BouncyCastle, pyca/cryptography, Go std)"
    vendor: PQCA (Linux Foundation)
    url: "https://github.com/cbomkit/cbomkit-action"
    version: "2.3.0"
    version_url: "https://github.com/cbomkit/cbomkit-action/releases/tag/v2.3.0"
    shipped: GitHub Action (Docker image running a jar)
    cbom_by: tool
    languages: [java, python, go]
    voter_group: cbomkit            # one voter together with cbomkit; a separate tool in every other table
    status: integrated              # workers/cbomkit-jar; source-only scan (CBOMKIT_JAVA_REQUIRE_BUILD=false), CBOMKIT_LANGUAGES from the repo language
  cdxgen:
    engine: cdxgen
    packaging: per algorithm    # one component per algorithm; one location at most (Go, a property), none in Java
    memory_gb: 24                   # 4 OOM-killed Gradle on bisq/bisq2 (2026-10-18); 8 still on Chat2DB, bisq, bisq2, kafka (2026-10-19); 16 on 8 of 60 pilot-medium repos (2026-10-23)
    approach: atom (code analysis) and golem (Go type checking) + dependency manifests, its crypto output mostly libraries and certificates
    vendor: OWASP cdxgen
    url: "https://github.com/cdxgen/cdxgen"
    version: "13.5.0"
    version_url: "https://github.com/cdxgen/cdxgen/releases/tag/v13.5.0"
    shipped: CLI (npm package, Docker image)
    cbom_by: tool
    # the CBOM support its README claims (13.5.0): Java keystores and certificates, JS/TS source-level algorithms, and
    # Go through golem (docs/GO_EVINSE_GOLEM.md); no Python crypto, so Python is left out (2026-10-31)
    languages: [java, javascript, go]   # crypto locations: JS/TS occurrences and Go sourceLocation properties
    status: integrated              # image 13.5.0 (11.7.0 found nothing on any micro project)
    notes: >
      Algorithms with file/line for JS/TS (occurrences) and Go (cdx:golem:crypto:sourceLocation, one per asset).
      Java: keystores and certificates as claimed, code-level algorithms without locations at most. The worker
      passes --include-crypto --evidence and -t java / -t go for those languages (13.x has no Java fallback without
      -t). Go analysis needs resolvable imports, network and a writable module cache; each job has its own GOPATH
      since 2026-10-22. See docs/findings.md for the fixture and worker setup fixes.
  cryptobomforge:
    engine: codeql                  # Santander cryptobom-forge on CodeQL crypto queries
    packaging: per algorithm    # one component per variant (AES, AES-128-CBC, AES-128-CBC-PKCS7 apart), its windows as places
    memory_gb: 6
    approach: "CodeQL: data flow, CodeQL's crypto inventory queries"
    vendor: Santander Security Research
    url: "https://github.com/Santandersecurityresearch/cryptobom-forge"
    version: "1.1.0"
    version_url: "https://github.com/Santandersecurityresearch/cryptobom-forge/releases/tag/1.1.0"
    shipped: CLI (Python package) over the CodeQL CLI
    cbom_by: tool                   # its own IBM pre-standard draft `1.4-cbom-1.0` (bomFormat CBOM, type crypto-asset), not CycloneDX
    languages: [python, c]          # upstream CodeQL crypto queries exist for Python and C/C++ only (no Java query)
    status: integrated              # runs experimental/cryptography/inventory/new_models (before 2026-10-17: CodeQL's default security suite by mistake)
  deepseek:
    engine: llm                     # provider adapters share prompts and file selection (common/llm_cbom.py, Phase 2)
    packaging: per hit          # our assembly: one component per asset the model names, with its one file and line
    memory_gb: 1
    approach: LLM reading pre-filtered source files
    vendor: DeepSeek
    url: "https://api-docs.deepseek.com"
    shipped: HTTP API, CBOM assembled by BF-CBOM
    cbom_by: bf-cbom                # assembled by the worker from the model's structured answer
    languages: [java, python, go, javascript, c]
    voter_group: deepseek           # each LLM is its own voter; `--merge-llm` merges them into `merge_group`
    merge_group: llm
    status: integrated
  chatgpt:
    engine: llm
    packaging: per hit          # as deepseek (common/llm_cbom.py)
    memory_gb: 1
    approach: LLM reading pre-filtered source files (same prompts and file selection as deepseek)
    vendor: OpenAI
    url: "https://platform.openai.com/docs"
    shipped: HTTP API, CBOM assembled by BF-CBOM
    cbom_by: bf-cbom                # assembled by the worker from the model's structured answer
    languages: [java, python, go, javascript, c]
    voter_group: chatgpt
    merge_group: llm
    status: integrated              # needs OPENAI_API_KEY (compose profile llm)
  claude:
    engine: llm
    packaging: per hit          # as deepseek (common/llm_cbom.py)
    memory_gb: 1
    approach: LLM reading pre-filtered source files (same prompts and file selection as deepseek)
    vendor: Anthropic
    url: "https://docs.anthropic.com"
    shipped: HTTP API, CBOM assembled by BF-CBOM
    cbom_by: bf-cbom                # assembled by the worker from the model's structured answer
    languages: [java, python, go, javascript, c]
    voter_group: claude
    merge_group: llm
    status: integrated              # needs ANTHROPIC_API_KEY (compose profile llm)
  cryptoscan:
    engine: cryptoscan               # CSNP CryptoScan 1.5.0, regex pattern catalogue (90+ patterns)
    packaging: per family       # one component per category (RSA, ECC, ...), the matched text at each place carries the algorithm
    memory_gb: 2
    approach: "own engine: regex patterns (90+)"
    vendor: CSNP (CyberSecurity Non-Profit)
    url: "https://github.com/csnp/cryptoscan"
    version: "1.5.0"
    version_url: "https://github.com/csnp/cryptoscan/releases/tag/v1.5.0"
    shipped: CLI (Go binary)
    cbom_by: tool                   # `--format cbom` emits CycloneDX 1.6 with evidence.occurrences
    languages: [java, python, go, javascript, typescript, c, cpp, rust, csharp, ruby, php]
    status: integrated

  # ---- passed the pilot's inclusion bar (2026-10-08); workers added 2026-10-15 (provenance: docs/pilot-2026-10-08/README.md)
  pqcheck:
    engine: pqcheck                 # github.com/Rafael-Ryu/pqcheck 0.1.0 (Apache-2.0), tree-sitter + go/types
    packaging: per hit          # one component per finding, one occurrence
    memory_gb: 4
    approach: syntax tree (tree-sitter), Go via go/types when a Go toolchain is present
    vendor: Rafael Ryu (individual)
    url: "https://github.com/Rafael-Ryu/pqcheck"
    version: "0.1.0"
    version_url: "https://github.com/Rafael-Ryu/pqcheck/releases/tag/pqcheck-v0.1.0"
    shipped: CLI (Python package, built from source, with a Go helper for Go)
    cbom_by: tool
    languages: [python, go]
    status: integrated             # workers/pqcheck
  qdarpan:
    engine: q-darpan                # github.com/RohanExploit/q-darpan 72a4eddfcc8c (Apache-2.0), tree-sitter
    packaging: per algorithm    # one component per algorithm, its places as occurrences (moved there by our worker adapter)
    memory_gb: 4
    approach: syntax tree (tree-sitter)
    vendor: Rohan Gaikwad (individual)
    url: "https://github.com/RohanExploit/q-darpan"
    version: "72a4edd"
    version_url: "https://github.com/RohanExploit/q-darpan/commit/72a4eddfcc8c115d168be4ec26107fb539020675"
    shipped: CLI (Python package, built from source)
    cbom_by: tool                   # CycloneDX 1.7, but locations only in custom properties qdarpan:location.N (adapter moves them to evidence.occurrences)
    languages: [java, go, c]
    status: integrated             # workers/qdarpan
  securin-xbom:
    engine: semgrep-rules           # github.com/securin-public/securin-xbom a270c5ffd393 (Apache-2.0), ~13 semgrep rule files
    packaging: per hit          # one component per rule match, one occurrence
    memory_gb: 4
    approach: "Semgrep: pattern rules (its own and semgrep.dev registry rule sets)"
    vendor: Securin
    url: "https://github.com/securin-public/securin-xbom"
    version: "a270c5f"
    version_url: "https://github.com/securin-public/securin-xbom/commit/a270c5ffd393d904efc1d5ad51f406dabe197117"
    shipped: CLI (Python package, built from source)
    cbom_by: tool
    languages: [java, python]
    voter_group: securin-xbom       # own voter: its semgrep-registry rules share no rule with CipherRadar's (analysis/README.md "Voter groups")
    engine_family: semgrep          # semgrep engine; CipherRadar and SCANOSS run opengrep, its fork
    status: integrated             # workers/securin-xbom
    notes: runs offline with the semgrep.dev rule sets it fetches online (r/java.lang.security, r/python.cryptography) frozen at a pinned semgrep-rules commit, unfiltered; before 2026-10-17 offline mode silently dropped them. Its cdxgen layer is broken with cdxgen 12
  cipherradar:
    engine: opengrep-rules          # github.com/nk-sentinel/cipherradar efa5d9de322c, opengrep 1.33.1 rules + tree-sitter + YARA
    packaging: per hit          # one component per finding, one occurrence
    memory_gb: 12                   # 4 killed it (rc=-9) on pycryptodome, bunkerweb, pyca/cryptography (2026-10-23); 8 until 2026-10-30 (peak 7.3 on bunkerweb)
    approach: "OpenGrep: pattern rules, plus tree-sitter and YARA-X passes"
    vendor: nk-sentinel (individual)
    url: "https://github.com/nk-sentinel/cipherradar"
    version: "efa5d9d"
    version_url: "https://github.com/nk-sentinel/cipherradar/commit/efa5d9de322c9120b15acc2e958dc6c1c4e609e1"
    shipped: CLI (Go binary, built from source)
    cbom_by: tool                   # CycloneDX 1.7
    languages: [java, python, go, javascript]   # Java: nil-pointer crash on `new ECGenParameterSpec(<identifier>)` (jjwt, Keycloak) fails the run; the worker's .cradarignore workaround (CRADAR_EXCLUDE_CRASHERS) is off since 2026-10-31
    voter_group: cipherradar        # own voter: its rules share no rule with securin-xbom's or SCANOSS's (3 bare API names in Go)
    engine_family: semgrep          # opengrep (a semgrep fork) for its rule pass, plus tree-sitter and YARA-X passes
    status: integrated             # workers/cipherradar
    notes: very noisy solo findings (17-31 % precise when alone in the pilot); needs writable XDG_* dirs or opengrep dies silently

  ciphersift:
    engine: ciphersift              # CipherSift v1.2.0 (SEG-UNIBE, Apache-2.0): clean-room reimplementation of the approach of Crypsy (Näther & Hirsch, arXiv 2608.04857) for Java, Python and Go
    packaging: per rule         # one component per rule match on one API, its places as occurrences; several rules name one algorithm
    memory_gb: 4
    approach: syntax tree (tree-sitter) + YAML rules (name and constant resolution, wrapper propagation)
    vendor: SEG, University of Bern
    url: "https://github.com/SEG-UNIBE/ciphersift"
    version: "1.2.0"
    version_url: "https://github.com/SEG-UNIBE/ciphersift/tree/v1.2.0"
    shipped: CLI (Java jar)
    cbom_by: tool                   # CycloneDX 1.7, family in algorithmProperties.algorithmFamily
    languages: [java, python, go]
    voter_group: ciphersift
    status: integrated              # workers/ciphersift; release pinned in docker/Dockerfile.worker-ciphersift
    tailored_on: [experiments/corpus/micro, experiments/corpus/pilot-2026-10-08-all.yaml]   # paths from the repo root; benchmark-informed rules and defaults (its spec/DECISIONS.md): no held-out data for it
    notes: >
      Written from a behavioural specification of Crypsy; its Java/Python rules were converted from the earlier BF-CBOM
      Crypsy adaptation (spec/PROVENANCE.md). Also lists crypto libraries from Maven/Gradle, PyPI and Go manifests.
      Non-crypto PRNGs are reported only with --weakness-indicators (off here); unresolved Java algorithm strings
      give *.unresolved components without a family. No inter-procedural data flow beyond constants and wrappers.

  # ---- integrated 2026-10-17 with its public open rules; its full rule set (Java, Python) needs a SCANOSS API key
  scanoss:
    engine: opengrep-rules          # SCANOSS crypto-finder 0.43.0 on opengrep 1.22.0, rules scanoss/open-crypto-rules@55d46c2365c1
    packaging: per algorithm    # one component per (algorithm, parameters), every match an occurrence
    memory_gb: 4
    approach: "OpenGrep: pattern rules (scanoss/open-crypto-rules) + call graph"
    vendor: SCANOSS
    url: "https://github.com/scanoss/crypto-finder"
    version: "0.43.0"
    version_url: "https://github.com/scanoss/crypto-finder/releases/tag/v0.43.0"
    shipped: CLI (Go binary)
    cbom_by: tool                   # `--format cyclonedx`; declares CycloneDX 1.7 (its docs still say 1.6)
    languages: [go, c, javascript, rust]   # what the open rules cover; Java/Python rules only through the API with a key
    voter_group: scanoss            # own voter: scanoss/open-crypto-rules share no rule with CipherRadar's (3 bare API names in Go)
    engine_family: semgrep          # opengrep (a semgrep fork)
    status: integrated              # workers/scanoss; binary, opengrep and rules commit pinned in docker/Dockerfile.worker-scanoss
    notes: >
      Offline with --no-remote-rules --rules-dir (the documented mode without a key), otherwise its defaults: test
      sources and vendor dirs excluded, call graph built. Rules detect terminal crypto operations only. AES
      parameterSetIdentifier is the key length in bytes (32 for AES-256), not bits as CycloneDX defines it. A
      committed scanoss.json in a scanned repo sets skip patterns (recorded in the run notes).
  xgrep:
    engine: mondoo-xgrep            # proprietary binary (free of charge) from the public npm package, pinned 0.101.0
    packaging: per algorithm    # one component per algorithm (AES-128 and AES-256 apart), its places as occurrences
    memory_gb: 8                    # 4 until 2026-10-30 (peak 3.0 on parse-server)
    approach: "own engine (proprietary): syntax tree (tree-sitter) + data flow"
    vendor: Mondoo
    url: "https://xgrep.ai"
    version: "0.101.0"
    version_url: "https://www.npmjs.com/package/@mondoohq/xgrep/v/0.101.0"
    shipped: CLI (proprietary binary, npm package)
    cbom_by: tool
    languages: [java, python, go, javascript]
    status: integrated              # workers/xgrep
  # ---- blocked on access (CLAUDE.md, Phase 2)
  cryptoscope:
    engine: ibm-cryptoscope
    packaging: unknown          # no output seen
    approach: data flow
    vendor: IBM Research
    url: ""
    shipped: not public
    cbom_by: unknown
    languages: [java]
    status: blocked

  # ---- failed the bar exam (2026-10-23); integrated, run on bar-micro only
  qelens:
    engine: qelens                  # qelens/cbom (ex keylens, MPL-2.0), crate `cbom` 0.1.2
    packaging: per hit          # one component per finding on an import line, one occurrence
    memory_gb: 4
    approach: syntax tree (tree-sitter), dependency lockfiles
    vendor: qelens
    url: "https://github.com/qelens/cbom"
    version: "0.1.2"
    version_url: "https://crates.io/crates/cbom/0.1.2"
    shipped: CLI (Rust crate)
    cbom_by: tool                   # `--format cyclonedx` (specVersion 1.6; its docs say 1.5)
    languages: [python, javascript] # its SUPPORTED_LANGUAGES.md; Rust only through Cargo.lock
    status: integrated              # workers/qelens; release pinned in docker/Dockerfile.worker-qelens
  cryptarium:
    engine: cryptarium              # sgoveia/cryptarium v0.3.0 (Apache-2.0)
    packaging: no places        # its CBOM carries no evidence at all (only its own JSON format has locations)
    memory_gb: 4
    approach: syntax tree (tree-sitter) + YAML rule packs (embedded), also certificates, keys, nginx/SSH/JWT configs
    vendor: sgoveia (individual)
    url: "https://github.com/sgoveia/cryptarium"
    version: "0.3.0"
    version_url: "https://github.com/sgoveia/cryptarium/releases/tag/v0.3.0"
    shipped: CLI (Go binary)
    cbom_by: tool
    languages: [java, python, go, javascript, c]
    status: integrated              # workers/cryptarium; release tag pinned in docker/Dockerfile.worker-cryptarium
  qscan:
    engine: qscan                   # quantakrypto/pqc-tools, npm @quantakrypto/qscan 0.12.0 (Apache-2.0)
    packaging: per algorithm    # one component per (asset type, algorithm, discriminator), its places as occurrences
    memory_gb: 4
    approach: patterns (own TypeScript detectors), also dependency manifests, keys, TLS and IaC configs
    vendor: QuantaKrypto
    url: "https://github.com/quantakrypto/pqc-tools"
    version: "0.12.0"
    version_url: "https://www.npmjs.com/package/@quantakrypto/qscan/v/0.12.0"
    shipped: CLI (npm package)
    cbom_by: tool                   # `--format cbom` (CycloneDX 1.6)
    languages: [java, python, go, javascript, c, rust, csharp, ruby, php]   # of its 14 claimed languages, those in our list
    status: integrated              # workers/qscan; npm release pinned in docker/Dockerfile.worker-qscan
    notes: offline by default; the optional LLM triage (--triage) and supply-chain audit (--audit) are never enabled

  # ---- not integrated: pqc-mat (decided 2026-10-19). Its code scanner VECTOR-Code (AbstractionsLab/pqc-mat, AGPL-3.0)
  # runs CodeQL's crypto inventory queries and converts the SARIF with cryptobom-forge: the engine of our
  # cryptobomforge worker, repackaged (the pilot's -2 line offset is cryptobom-forge's context window). Failed the pilot.
  # ---- not integrated by decision (2026-10-17)
  # OQS Scanner (jimbo111/open-quantum-secure, MIT): an orchestrator over third-party engines (semgrep, ast-grep,
  # cipherscope; optionally CryptoScan and cdxgen); failed the pilot, passed the coworker's audit (micro 11/9/11)
