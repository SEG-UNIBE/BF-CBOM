# FROZEN test data, not the ground truth: the hand-written micro ground truth of 2026-10-08 (Java, Python and Go), the
# projects that the CBOMs in this folder were made on. tests/test_analysis.py and tests/test_normalize.py score those
# CBOMs against it. In the current format (`group`, per-project `expected`); the real ground truth is
# corpus/micro/ground_truth.yaml, generated by `python -m mutation.micro`.
version: '2026-10-08'
assets:
- id: rsa-2048-keygen
  group: RSA
  families: [RSA]
  keygen: true
- id: ec-p256-keygen
  group: EC
  families: [EC]
  keygen: true
- id: aes-256-key
  group: AES
  families: [AES]
  keygen: true
- id: aes-gcm-encrypt
  group: AES
  families: [AES]
- id: des-cbc
  group: DES
  families: [DES]
- id: sha-256
  group: SHA-2
  families: [SHA-2]
- id: md5
  group: MD5
  families: [MD5]
- id: hmac-sha512
  group: HMAC
  families: [HMAC, SHA-2]
- id: ecdsa-sha256-sign
  group: EC
  families: [EC]
  insertion_style: constant
- id: rsa-oaep-sha256
  group: RSA
  families: [RSA]
- id: pbkdf2-hmac-sha256
  group: PBKDF
  families: [PBKDF]
projects:
  micro-java:
    path: corpus/micro/java
    language: java
    file: src/main/java/app/CryptoDemo.java
    lines:
      rsa-2048-keygen: [12, 13]
      ec-p256-keygen: [16, 17]
      aes-256-key: [20, 21]
      aes-gcm-encrypt: [24, 25]
      des-cbc: [27]
      sha-256: [29]
      md5: [30]
      hmac-sha512: [32]
      ecdsa-sha256-sign: [34, 35]
      rsa-oaep-sha256: [37, 38]
      pbkdf2-hmac-sha256: [40, 41]
    expected:
      rsa-2048-keygen: {unit: RSA, family: RSA, key_size: 2048}
      ec-p256-keygen: {unit: EC, family: EC, curve: secp256r1}
      aes-256-key: {unit: AES, family: AES, key_size: 256}
      aes-gcm-encrypt: {unit: AES, family: AES, key_size: 256, mode: GCM}
      des-cbc: {unit: DES, family: DES, mode: CBC}
      sha-256: {unit: SHA-256, family: SHA-2}
      md5: {unit: MD5, family: MD5}
      hmac-sha512: {unit: HMAC, family: HMAC, digest: SHA-512}
      ecdsa-sha256-sign: {unit: ECDSA, family: ECDSA, digest: SHA-256, curve: secp256r1}
      rsa-oaep-sha256: {unit: RSAES-OAEP, family: RSAES-OAEP, padding: OAEP, digest: SHA-256}
      pbkdf2-hmac-sha256: {unit: PBKDF2, family: PBKDF2, digest: SHA-256, iterations: 600000}
    related: {9: SIG_ALG constant ("SHA256withECDSA") used on line 34}
  micro-python:
    path: corpus/micro/python
    language: python
    file: app/crypto_demo.py
    lines:
      rsa-2048-keygen: [15]
      ec-p256-keygen: [16]
      aes-256-key: [18]
      aes-gcm-encrypt: [19]
      des-cbc: [21]
      sha-256: [23]
      md5: [24]
      hmac-sha512: [26]
      ecdsa-sha256-sign: [28]
      rsa-oaep-sha256: [30]
      pbkdf2-hmac-sha256: [35]
    expected:
      rsa-2048-keygen: {unit: RSA, family: RSA, key_size: 2048}
      ec-p256-keygen: {unit: EC, family: EC, curve: secp256r1}
      aes-256-key: {unit: AES, family: AES, key_size: 256}
      aes-gcm-encrypt: {unit: AES, family: AES, key_size: 256, mode: GCM}
      des-cbc: {unit: 3DES, family: 3DES, mode: CBC}
      sha-256: {unit: SHA-256, family: SHA-2}
      md5: {unit: MD5, family: MD5}
      hmac-sha512: {unit: HMAC, family: HMAC, digest: SHA-512}
      ecdsa-sha256-sign: {unit: ECDSA, family: ECDSA, digest: SHA-256, curve: secp256r1}
      rsa-oaep-sha256: {unit: RSAES-OAEP, family: RSAES-OAEP, padding: OAEP, digest: SHA-256}
      pbkdf2-hmac-sha256: {unit: PBKDF2, family: PBKDF2, digest: SHA-256, iterations: 600000}
    related: {11: HASH constant (hashes.SHA256()) used on line 28, 32: OAEP padding arguments of the call on line 30}
  micro-go:
    path: corpus/micro/go
    language: go
    file: main.go
    lines:
      rsa-2048-keygen: [26]
      ec-p256-keygen: [27]
      aes-256-key: [29, 31]
      aes-gcm-encrypt: [32, 34]
      des-cbc: [36, 37]
      sha-256: [41]
      md5: [42]
      hmac-sha512: [44]
      ecdsa-sha256-sign: [50, 48]
      rsa-oaep-sha256: [52]
      pbkdf2-hmac-sha256: [56]
    expected:
      rsa-2048-keygen: {unit: RSA, family: RSA, key_size: 2048}
      ec-p256-keygen: {unit: EC, family: EC, curve: secp256r1}
      aes-256-key: {unit: AES, family: AES, key_size: 256}
      aes-gcm-encrypt: {unit: AES, family: AES, key_size: 256, mode: GCM}
      des-cbc: {unit: 3DES, family: 3DES, mode: CBC}
      sha-256: {unit: SHA-256, family: SHA-2}
      md5: {unit: MD5, family: MD5}
      hmac-sha512: {unit: HMAC, family: HMAC, digest: SHA-512}
      ecdsa-sha256-sign: {unit: ECDSA, family: ECDSA, digest: SHA-256, curve: secp256r1}
      rsa-oaep-sha256: {unit: RSAES-OAEP, family: RSAES-OAEP, padding: OAEP, digest: SHA-256}
      pbkdf2-hmac-sha256: {unit: PBKDF2, family: PBKDF2, digest: SHA-256, iterations: 600000}
    related: {21: SigHash constant (crypto.SHA256) used on line 48}
    accepted:
      30: [RANDOM, AES]
      33: [AES]
      39: [DES]
      45: [HMAC]
      46: [HMAC]
      49: [SHA-2]
      55: [RANDOM]
      26: [RANDOM]
      27: [RANDOM]
      50: [RANDOM]
      52: [SHA-2, RANDOM]
      56: [SHA-2, HMAC]
