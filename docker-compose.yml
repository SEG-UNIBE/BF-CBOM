      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BF_CBOM_IMAGE=bf-cbom/worker-cbomkit:${VERSION:-latest}
      - REDIS_PORT=6379
      - WORKER_TIMEOUT_SEC=2700  # keycloak 469-551 s, kafka 363 s (2.3.0); pilot used 45 min
      - CBOMKIT_HEALTH_WAIT_SEC=20
      - JAVA_OPTS=-Xms1g -Xmx6g -XX:+ExitOnOutOfMemoryError
    env_file: docker/env/worker-cbomkit.env
    volumes:
      - git-certs:/certs:ro  # trust the local git server's certificate (CBOMkit forces https)
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 8g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [prod, all]

  worker-cdxgen:
    image: bf-cbom/worker-cdxgen:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.worker-cdxgen
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG:   ${VERSION:-latest}
        BF_CBOM_COMMIT: ${BF_CBOM_COMMIT:-unknown}
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BF_CBOM_IMAGE=bf-cbom/worker-cdxgen:${VERSION:-latest}
      - REDIS_PORT=6379
      - WORKER_TIMEOUT_SEC=1800  # e1-icpc-corpus at 600: Sentinel, Sa-Token timed out (Maven), Chat2DB took 574 s
      - CDXGEN_DEBUG_MODE=debug
    env_file: docker/env/worker-cdxgen.env
    restart: on-failure:3
    deploy:
      resources:
        limits:
          # 4g OOM-killed its Gradle runs on bisq/bisq2 (rc=-9, e1-icpc-corpus); 8g was still OOM-killed on
          # Chat2DB, bisq, bisq2 and kafka with the runs stored ok (2026-10-19)
          memory: 16g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [prod, all]


  worker-deepseek:
    image: bf-cbom/worker-deepseek:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.worker-deepseek
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG: ${VERSION:-latest}
        BF_CBOM_COMMIT: ${BF_CBOM_COMMIT:-unknown}
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BF_CBOM_IMAGE=bf-cbom/worker-deepseek:${VERSION:-latest}
      - REDIS_PORT=6379
      - WORKER_TIMEOUT_SEC=7200
      # code-reading LLM budget (common/llm_cbom.py): files sent, chars per request, chunks per repo (a safety
      # valve: 100 cut bisq2's 312 chunks; a capped run is marked in runs.csv), requests in flight
      - LLM_MAX_FILES=1000
      - LLM_MAX_CHUNK_CHARS=40000
      - LLM_MAX_CHUNKS=1000
      - LLM_CONCURRENCY=4
      # deepseek-v4-pro thinks by default: the output limit covers the reasoning (DeepSeek's own thinking-mode default
      # is 64K), answers take longer, and a temperature has no effect, so none is sent (the CBOM says `default`)
      - LLM_MAX_OUTPUT_TOKENS=65536
      - LLM_API_TIMEOUT_SEC=900
    env_file: docker/env/worker-deepseek.env
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [prod, all]

