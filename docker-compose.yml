name: bf-cbom
services:

  redis:
    image: redis:7.4@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    ports:
      - "127.0.0.1:6379:6379"  # loopback only: Redis has no auth
    volumes:
      - redis-data:/data
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 2s
        timeout: 2s
        retries: 5
        start_period: 1s

  # Local read-only git server (smart HTTP) on the compose network only. The runner mirrors every
  # repo here at its pinned commit and pushes mutant branches; workers clone from
  # http://gitserver/<owner>/<repo>.git so all tools scan identical bytes.
  gitserver:
    image: bf-cbom/gitserver:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.gitserver
    volumes:
      - git-data:/srv/git
      - git-certs:/certs
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 256m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 2s

  # Batch experiment runner (on demand): `docker compose run --rm runner experiment run /app/experiments/<x>.yaml`
  runner:
    image: bf-cbom/runner:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.runner
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG: ${VERSION:-latest}
    depends_on:
      redis:
        condition: service_healthy
      gitserver:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RESULTS_DIR=/data/results
      - GIT_MIRROR_DIR=/srv/git
      - GITSERVER_URL=http://gitserver
    env_file: docker/env/coordinator.env  # GITHUB_TOKEN for the corpus builder
    volumes:
      - results-data:/data/results
      - git-data:/srv/git
      - ./experiments:/app/experiments:ro
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 2g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [tools]

  coordinator:
    image: bf-cbom/coordinator:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.coordinator
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG: ${VERSION:-latest}
    ports:
      - "127.0.0.1:8501:8501"  # loopback only; the UI exposes config/tokens
    depends_on:
      - redis
    environment:
      - AVAILABLE_WORKERS=${AVAILABLE_WORKERS:-cdxgen,cbomkit,deepseek,cryptobomforge}
      - AVAILABLE_LANGUAGES=python,java
      - GITHUB_CACHE_TTL_SEC=86400
      - COMPONENT_MATCH_WAIT_SEC=420
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file: docker/env/coordinator.env
    volumes:
      - results-data:/data/results:ro  # stored experiments (read-only in the UI)
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 1s

  worker-skeleton:
    image: bf-cbom/worker-skeleton:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.worker-skeleton
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG: ${VERSION:-latest}
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BF_CBOM_IMAGE=bf-cbom/worker-skeleton:${VERSION:-latest}
      - REDIS_PORT=6379
      - WORKER_TIMEOUT_SEC=6
    env_file: docker/env/worker-skeleton.env
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [dev, all]


  worker-testing:
    image: bf-cbom/worker-testing:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.worker-testing
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG: ${VERSION:-latest}
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BF_CBOM_IMAGE=bf-cbom/worker-testing:${VERSION:-latest}
      - REDIS_PORT=6379
      - WORKER_TIMEOUT_SEC=6
      - TESTING_MIN_CBOM_KB=50
      - TESTING_MAX_CBOM_KB=1000
    env_file: docker/env/worker-testing.env
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [dev, all]

  worker-cbomkit:
    image: bf-cbom/worker-cbomkit:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.worker-cbomkit
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG: ${VERSION:-latest}
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BF_CBOM_IMAGE=bf-cbom/worker-cbomkit:${VERSION:-latest}
      - REDIS_PORT=6379
      - WORKER_TIMEOUT_SEC=600
      - CBOMKIT_HEALTH_WAIT_SEC=20
      - JAVA_OPTS=-Xms1g -Xmx6g -XX:+ExitOnOutOfMemoryError
    env_file: docker/env/worker-cbomkit.env
    volumes:
      - git-certs:/certs:ro  # trust the local git server's certificate (CBOMkit forces https)
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 8g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [prod, all]

  worker-cdxgen:
    image: bf-cbom/worker-cdxgen:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.worker-cdxgen
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG:   ${VERSION:-latest}
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BF_CBOM_IMAGE=bf-cbom/worker-cdxgen:${VERSION:-latest}
      - REDIS_PORT=6379
      - WORKER_TIMEOUT_SEC=600
      - CDXGEN_DEBUG_MODE=debug
    env_file: docker/env/worker-cdxgen.env
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 4g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [prod, all]


  worker-deepseek:
    image: bf-cbom/worker-deepseek:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.worker-deepseek
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG: ${VERSION:-latest}
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BF_CBOM_IMAGE=bf-cbom/worker-deepseek:${VERSION:-latest}
      - REDIS_PORT=6379
      - WORKER_TIMEOUT_SEC=120
    env_file: docker/env/worker-deepseek.env
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [prod, all]

  worker-mssbomtool:
    image: bf-cbom/worker-mssbomtool:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.worker-mssbomtool
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG: ${VERSION:-latest}
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BF_CBOM_IMAGE=bf-cbom/worker-mssbomtool:${VERSION:-latest}
      - REDIS_PORT=6379
      - WORKER_TIMEOUT_SEC=120
    env_file: docker/env/worker-mssbomtool.env
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 2g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [dev, all]

  worker-cryptobomforge:
    image: bf-cbom/worker-cryptobomforge:${VERSION:-latest}
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./docker/Dockerfile.worker-cryptobomforge
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG: ${VERSION:-latest}
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BF_CBOM_IMAGE=bf-cbom/worker-cryptobomforge:${VERSION:-latest}
      - REDIS_PORT=6379
      - WORKER_TIMEOUT_SEC=600
      - AVAILABLE_LANGUAGES=python,java
      - CODEQL_RAM_MB=4096
    env_file: docker/env/worker-cryptobomforge.env
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 6g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [prod, all]

  misc-treesimilarity:
    image: bf-cbom/misc-treesimilarity:${VERSION:-latest}
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./docker/Dockerfile.misc-treesimilarity
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BF_CBOM_IMAGE=bf-cbom/misc-treesimilarity:${VERSION:-latest}
      - REDIS_PORT=6379
      - CALC_TIMEOUT_SEC=300
    env_file: docker/env/misc-treesimilarity.env
    restart: no
    deploy:
      resources:
        limits:
          memory: 2g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [dev]

  misc-pyqun:
    image: bf-cbom/misc-pyqun:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.misc-pyqun
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BF_CBOM_IMAGE=bf-cbom/misc-pyqun:${VERSION:-latest}
      - REDIS_PORT=6379
      - CALC_TIMEOUT_SEC=300
    env_file: docker/env/misc-pyqun.env
    restart: no
    deploy:
      resources:
        limits:
          memory: 4g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [dev, prod, all]

volumes:
  redis-data:
  git-data:      # bare mirrors + mutant branches served by gitserver
  git-certs:     # gitserver's self-signed TLS certificate, trusted by worker-cbomkit
  results-data:  # experiment results (CBOMs + meta); export with `make experiment-export`
