      - LLM_MAX_FILES=1000
      - LLM_MAX_CHUNK_CHARS=40000
      - LLM_MAX_CHUNKS=1000
      - LLM_CONCURRENCY=4
      - LLM_MAX_OUTPUT_TOKENS=16000
      - LLM_API_TIMEOUT_SEC=300
      - OPENAI_MAX_TOKENS_PARAM=max_completion_tokens  # gpt-5 is a reasoning model (rejects max_tokens and temperature)
    env_file: docker/env/worker-chatgpt.env
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # no API key yet: opt in with `make up-prod EXTRA_PROFILES=llm` once docker/env/worker-chatgpt.env has the key
    profiles: [llm, all]

