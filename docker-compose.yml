name: bf-cbom
services:

  redis:
    image: redis:7.4@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    ports:
      - "127.0.0.1:6379:6379"  # loopback only: Redis has no auth
    volumes:
      - redis-data:/data
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 2s
        timeout: 2s
        retries: 5
        start_period: 1s

  # Local read-only git server (smart HTTP) on the compose network only. The runner mirrors every
  # repo here at its pinned commit and pushes mutant branches; workers clone from
  # http://gitserver/<owner>/<repo>.git so all tools scan identical bytes.
  gitserver:
    image: bf-cbom/gitserver:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.gitserver
      args:
        BF_CBOM_COMMIT: ${BF_CBOM_COMMIT:-unknown}
    volumes:
      - git-data:/srv/git
      - git-certs:/certs
    restart: on-failure:3
    deploy:
      resources:
        limits:
          # GITSERVER_MEMORY (Makefile): git pack-objects for a full clone of a large repo runs in this cgroup;
          # 256m was OOM-killed on keycloak and ansible (CBOMkit's JGit clone, 2026-10-19)
          memory: ${GITSERVER_MEMORY:-6g}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 2s

  # Batch experiment runner (on demand): `docker compose run --rm runner experiment run /app/experiments/<x>.yaml`
  runner:
    image: bf-cbom/runner:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.runner
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG: ${VERSION:-latest}
        BF_CBOM_COMMIT: ${BF_CBOM_COMMIT:-unknown}
    depends_on:
      redis:
        condition: service_healthy
      gitserver:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RESULTS_DIR=/data/results
      - GIT_MIRROR_DIR=/srv/git
      - GITSERVER_URL=http://gitserver
      # Sum of worker memory limits (tools.yaml memory_gb) a batch run feeds at once; tools beyond it run in
      # later waves. Set per machine in the Makefile / environment; 0 = no limit (one wave).
      - EXPERIMENT_MEMORY_BUDGET_GB=${EXPERIMENT_MEMORY_BUDGET_GB:-14}
      # The git server's memory cap (recorded per session) and the corpus size cap derived from it (common/corpus.py)
      - GITSERVER_MEMORY=${GITSERVER_MEMORY:-6g}
      - CORPUS_MAX_REPO_SIZE_MB=${CORPUS_MAX_REPO_SIZE_MB:-}
    env_file: docker/env/coordinator.env  # GITHUB_TOKEN for the corpus builder
    volumes:
      - results-data:/data/results
      - git-data:/srv/git
      - ./experiments:/app/experiments:ro
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 2g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [tools]

  coordinator:
    image: bf-cbom/coordinator:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.coordinator
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG: ${VERSION:-latest}
        BF_CBOM_COMMIT: ${BF_CBOM_COMMIT:-unknown}
    ports:
      - "127.0.0.1:8501:8501"  # loopback only; the UI exposes config/tokens
    depends_on:
      - redis
    environment:
      - AVAILABLE_WORKERS=${AVAILABLE_WORKERS:-cdxgen,cbomkit,deepseek,cryptobomforge,cryptoscan,chatgpt,claude,pqcheck,qdarpan,securin-xbom,cipherradar,xgrep,cbomkit-jar,ciphersift}
      - AVAILABLE_LANGUAGES=python,java,go
      - EXPERIMENT_MEMORY_BUDGET_GB=${EXPERIMENT_MEMORY_BUDGET_GB:-14}  # UI batches run in waves like the runner
      - GITHUB_CACHE_TTL_SEC=86400
      - COMPONENT_MATCH_WAIT_SEC=420
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file: docker/env/coordinator.env
    volumes:
      - results-data:/data/results:ro  # stored experiments (read-only in the UI)
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 1s

  worker-skeleton:
    image: bf-cbom/worker-skeleton:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.worker-skeleton
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG: ${VERSION:-latest}
        BF_CBOM_COMMIT: ${BF_CBOM_COMMIT:-unknown}
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BF_CBOM_IMAGE=bf-cbom/worker-skeleton:${VERSION:-latest}
      - REDIS_PORT=6379
      - WORKER_TIMEOUT_SEC=6
    env_file: docker/env/worker-skeleton.env
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [dev, all]


  worker-testing:
    image: bf-cbom/worker-testing:${VERSION:-latest}
