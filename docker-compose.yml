  worker-qscan:   # observer (common/tools.yaml role): harvested, not a voter
    image: bf-cbom/worker-qscan:${VERSION:-latest}
    build:
      context: .
      dockerfile: ./docker/Dockerfile.worker-qscan
      args:
        BASE_IMAGE: ${BASE_IMAGE:-base}
        BASE_TAG: ${VERSION:-latest}
        BF_CBOM_COMMIT: ${BF_CBOM_COMMIT:-unknown}
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - BF_CBOM_IMAGE=bf-cbom/worker-qscan:${VERSION:-latest}
      - REDIS_PORT=6379
      - WORKER_TIMEOUT_SEC=900
    env_file: docker/env/worker-qscan.env
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 4g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [prod, all]

