spec: scanoss
inherits: _cyclonedx
version: 1
declared: [{bomFormat: CycloneDX, specVersion: "1.7"}]
checked_on: "micro go/c/java 2026-10-17 (crypto-finder 0.37.1, open-crypto-rules@c5f32b7b)"
context: [occurrence:additionalContext]
notes: >
  One component per (algorithm, parameters) with every match as an occurrence (file and line in the standard
  fields). Names are registry style or the API's spelling (AES-GCM, ECDSA-P256, HMAC-sha512, RSA-OAEP-sha256,
  des_ede3_cbc, OpenSSL-RAND, PBKDF2---); the standard reading maps all of them. additionalContext is
  `scanoss:match,<matched code>`; the rule id sits in evidence.identity[].methods[].value (`scanoss:ruleid,<id>`).
  parameterSetIdentifier is the key length in bytes for AES (32 for AES-256) and in bits elsewhere (RSA 2048, 3DES
  168); it is read as CycloneDX defines it (bits), not corrected. implementationPlatform is always x86_64.
