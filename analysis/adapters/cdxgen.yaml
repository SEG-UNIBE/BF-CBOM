spec: cdxgen
inherits: _cyclonedx
version: 1
declared: [{bomFormat: CycloneDX, specVersion: "1.6"}]
checked_on: "e1-pilot-corpus 2026-10-16 (cdxgen 11.7.0, 12 CBOMs)"
findings:
  component_types: [cryptographic-asset]
  libraries: tagged
  library_tags: [crypto, encrypt]
locations: [evidence_occurrences, src_file_property]
sources:
  - fields: standard
  - {parse: name, quiet: true}     # crypto file names (openssl.rsa2048.pem): algorithm hints only
notes: >
  A full dependency SBOM (thousands of libraries, frameworks, GitHub actions) with `--include-crypto`. The only
  crypto assets are files found in the repo (cert.pem, client.key, kafka.keystore.jks), typed `certificate`,
  located by the property SrcFile (no line), with empty algorithmProperties (executionEnvironment/
  implementationPlatform `unknown`). Library import sites appear as occurrences `path#line`; only libraries cdxgen
  tags crypto/encrypt become records. No algorithm is ever reported with a line.
