# Price table for the LLM workers (analysis/costs.py): USD per 1M tokens, taken from the providers' official pricing
# pages on the `retrieved` date. Costs are computed offline from the stored token usage; `version` lands in runs.csv.
# Bump `version` and add entries (never edit old ones) when prices change; `valid_from` picks the entry for a run.
# `input` = tokens not served from a prompt cache, `cached_input` = cache reads, `cache_write` = cache creation
# (Anthropic; OpenAI and DeepSeek write for free), `output` includes reasoning tokens. DeepSeek bills by time of day:
# `off_peak` rates apply outside `peak_hours_utc` on weekdays and all weekend (Chinese public holidays not modelled).
version: "2026-10-18.1"
prices:
  - provider: deepseek
    models: [deepseek-flash, deepseek-v4-flash, deepseek-chat]
    note: >
      Official page lists deepseek-flash (served by DeepSeek-V4.1-Flash-1017) and the legacy name deepseek-v4-flash.
      `deepseek-chat` (the worker's default until 2026-10-18) is not on the page any more; third-party sources say it
      was a deprecated alias of V4-Flash (non-thinking) until 2026-07-24, yet it still answered on 2026-10-17. Priced
      as deepseek-flash for those runs; the worker asks for deepseek-v4-pro since 2026-10-21 (entry below).
    valid_from: "2026-10-18"
    input: 0.30
    cached_input: 0.006
    output: 1.20
    off_peak: {input: 0.15, cached_input: 0.003, output: 0.60}
    peak_hours_utc: [[1, 4], [6, 10]]
    source: https://api-docs.deepseek.com/quick_start/pricing
    retrieved: "2026-10-18"
  - provider: deepseek
    models: [deepseek-v4-pro]
    valid_from: "2026-10-18"
    input: 1.32
    cached_input: 0.044
    output: 3.96
    off_peak: {input: 0.66, cached_input: 0.022, output: 1.98}
    peak_hours_utc: [[1, 4], [6, 10]]
    source: https://api-docs.deepseek.com/quick_start/pricing
    retrieved: "2026-10-18"
