  EC: [ECC, elliptic, EllipticCurve, elliptic-curve]
  FFDH: [DH, DHE, Diffie-Hellman, DiffieHellman, FFDHE]
  ECDH: [ECDHE, ECDH-ES]
  EdDSA: [Ed-DSA]
  RSASSA-PKCS1: [RSASSA-PKCS1-v1_5, RSASSA-PKCS1-v1-5, RSASSA-PKCS1v15]
  RSASSA-PSS: [RSA-PSS, RSAPSS]
  RSAES-OAEP: [RSA-OAEP, RSAOAEP]
  RSAES-PKCS1: [RSAES-PKCS1-v1_5]
  ChaCha20: [CHACHA20, ChaCha-20]
  Blowfish: [BF]
  RC4: [ARCFOUR, ARC4, Arcfour]
  CAMELLIA: [Camellia]
  Whirlpool: [WHIRLPOOL]
  bcrypt: [BCRYPT, bcrypt_pbkdf]
  scrypt: [SCRYPT]
  HKDF: [HKDF]
  SP800-56C: [ConcatenationKDF, ConcatKDF, Concat-KDF]
  CSPRNG: [DRBG, SecureRandom, CSPRNG, csprng]
  PRNG: [rand, insecure-random, weak-random, PRNG]
  ML-KEM: [MLKEM, Kyber, ML_KEM]
  ML-DSA: [MLDSA, Dilithium, ML_DSA]
  SLH-DSA: [SLHDSA, SPHINCS, SPHINCS+, SPHINCSPlus]
