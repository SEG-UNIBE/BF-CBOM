# TLS cipher-suite names (Vocabulary._suite): IANA `TLS_<kx>[_<auth>][_EXPORT]_WITH_<cipher>_<mac>` and TLS 1.3
# `TLS_<aead>_<hash>` (RFC 5246 A.5, RFC 8446 B.4), OpenSSL's `[<kx>-][<auth>-]<cipher>-<mac>` (openssl-ciphers(1)).
# The record is the bulk cipher with its parameters and `protocol: TLS`; `skip` are the key exchange and
# authentication tokens, which are no values of that record; `mac` the MAC spellings, `SHA` being SHA-1 (RFC 5246 A.5);
# `ciphers` rewrites the spellings the token parser cannot read; `cipher_groups` are the groups a bulk cipher may be in
# (a name whose cipher part is none of them is no suite: `HMAC-SHA256`).
cipher_suites:
  skip: [RSA, DH, DHE, EDH, ADH, ECDH, ECDHE, AECDH, DSS, ECDSA, PSK, SRP, KRB5, anon, EXPORT, EXPORT1024, EXP, EXP1024, FIPS]
  mac: {SHA: SHA-1, SHA1: SHA-1, SHA224: SHA-224, SHA256: SHA-256, SHA384: SHA-384, SHA512: SHA-512, MD5: MD5, GOSTR3411: GOST}
  ciphers:
    DES-CBC3: 3DES-CBC            # OpenSSL's Triple DES (`DES-CBC3-SHA`)
    3DES_EDE: 3DES                # IANA `3DES_EDE_CBC`
    DES40: DES-40                 # export-grade DES, a 40-bit key
    CCM_8: CCM8                   # `AES_128_CCM_8`: CCM with an 8-byte tag
  cipher_groups: [AES, DES, ChaCha, CIPHER-other]

# Key and certificate containers: inside a name they set group CERT (when nothing names an algorithm).
keystores: [JKS, JCEKS, BKS, PKCS12, PKCS#12, P12, PFX, keystore, truststore, key-store, trust-store]

# Encodings and file formats: carry no algorithm, never reported as unmapped (also as multi-token sequences).
formats: [PEM, DER, CER, CRT, PKCS8, PKCS#8-encoded, PKCS10, OpenSSL, ASN1, ASN.1, Base64, JSON, JWK-set]

