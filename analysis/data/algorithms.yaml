# Tokens that announce a number: the next number becomes the dimension.
number_keywords:
  key_size: [keysize, key_size, keylength, keylen, keybits, modulus, modulussize, bitlength, bit_length]
  iterations: [iterations, iteration, iter, iters, rounds, cost, workfactor]

# Qualified API identifiers (prefix match; they never set `material`: an algorithm component's context is often
# the key spec it is used with; `.`, `/`, `#` and `:` are interchangeable, case does not matter), used as
