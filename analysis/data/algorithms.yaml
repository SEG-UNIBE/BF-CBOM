# Shared vocabulary of the normaliser (analysis/normalize/vocab.py): synonyms that are NOT specific to one tool.
#
# Canonical names come from the CycloneDX 1.7 cryptography registry (analysis/data/cyclonedx/cryptography-defs.json):
# `family` is a registry family (AES, RSAES-OAEP, ECDSA, SHA-2, ...) or one of the `additions` below, `curve` is a
# registry curve name (OID-equal names are aliases: secp256r1 = P-256 = prime256v1). Everything here is reviewed by
# hand and published with the paper (it is the per-field mapping table of RQ4). Rule: a spelling only one tool uses
# goes into that tool's dictionary (analysis/adapters/<tool>.yaml); once two tools use it, it moves here.
#
# Seeded on 2026-10-16 from the distinct values of 124 CBOMs of 11 tools (experiment e1-pilot-corpus). Frozen since
# 2026-10-18 (analysis/data/CHANGELOG.md, tests/test_vocab_frozen.py): the pilot corpus is the development set, every
# later edit bumps `version` with a reason. Rule for what belongs here: a spelling traceable to a standard or an official
# API (registry, RFC 7518 JOSE, RFC 4253/8332 SSH, JCA standard names, OS and library APIs) stays, however many tools
# use it; a label a tool invented (rule names, category labels) goes into that tool's spec, where `interpretive: true`
# marks mappings that are judgements rather than spellings (they count at L4 only, analysis/levels.py).
version: "2026-10-30.1"

# Coarse groups (the family names of analysis/data/families.yaml, used by the call-site matcher and the micro ground
# truth) -> the registry families and additions they contain. Every registry family must appear exactly once.
groups:
  RSA: [RSA, RSASSA-PKCS1, RSASSA-PSS, RSA-X931, RSAES-PKCS1, RSAES-OAEP]
  EC: [EC, ECDSA, EdDSA, ECDH, ECIES, MQV, SM2, SM9, BLS, X3DH, HPKE, XDH]
  DSA: [DSA]
  DH: [FFDH, ElGamal, SRP, J-PAKE, SPAKE2, SPAKE2PLUS, OPAQUE]
  PQC: [ML-KEM, ML-DSA, SLH-DSA, XMSS, LMS, FN-DSA, NTRU-Prime, Hybrid-KEM]
  AES: [AES]
  DES: [DES, 3DES]
  ChaCha: [ChaCha, ChaCha20, Salsa20, Poly1305]
  CIPHER-other: [RC2, RC4, RC5, RC6, IDEA, ARIA, CAMELLIA, Twofish, Blowfish, Skipjack, SEED, SM4, Serpent, CAST5, CAST6,
                 HC, RABBIT, Ascon, ZUC, SNOW3G, A5/1, A5/2, CMEA, GOST, MILENAGE, TUAK, 3GPP-XOR]
  SHA-1: [SHA-1]
  SHA-2: [SHA-2]
  SHA-3: [SHA-3]
  MD5: [MD5]
  HASH-other: [MD2, MD4, RIPEMD, Whirlpool, BLAKE2, BLAKE3, SM3, SHA]
  HMAC: [HMAC, CMAC, UMAC, SipHash, PBMAC1]
  PBKDF: [PBKDF1, PBKDF2, PBES1, PBES2, PBE]
  KDF-other: [HKDF, Argon2, bcrypt, scrypt, yescrypt, ANSI-KDF, SSH-KDF, TLS-PRF, IKE-PRF, SP800-108, SP800-56C, crypt]
  RANDOM: [CTR_DRBG, Hash_DRBG, HMAC_DRBG, Fortuna, Yarrow, CSPRNG, PRNG]

# Families the registry has no entry for, but tools report (RQ4: the delta to the registry, registry-run<i>.csv).
# `gap` names the kind of gap: missing-family (a scheme the registry lacks), scheme-less (a key type or use without
# a scheme, which the registry names only as schemes), generic-marker (a name that covers several registry entries
# and attaches to them without merging them), non-crypto (a non-cryptographic thing tools report as crypto).
additions:
  RSA: {gap: scheme-less, primitive: pke, note: "an RSA key pair or RSA use without a scheme (keygen, `KeyPairGenerator.getInstance(\"RSA\")`)"}
  EC: {gap: scheme-less, primitive: pke, note: "an EC key pair or curve without a scheme (ECDSA, ECDH, ...)"}
  CSPRNG: {gap: missing-family, primitive: drbg, note: "a cryptographically secure random generator without a named DRBG (SecureRandom, crypto/rand, os.urandom)"}
  PRNG: {gap: non-crypto, primitive: drbg, note: "a NON-cryptographic random generator (math/rand, java.util.Random, Math.random)"}
  PBE: {gap: scheme-less, primitive: other, note: "password-based encryption without a scheme"}
  FN-DSA: {gap: missing-family, primitive: signature, note: "Falcon (FIPS 206 draft)"}
  NTRU-Prime: {gap: missing-family, primitive: kem, note: "sntrup761 (OpenSSH hybrid key exchange)"}
  Hybrid-KEM: {gap: missing-family, primitive: kem, note: "a hybrid of a classical and a post-quantum key exchange"}
  crypt: {gap: missing-family, primitive: kdf, note: "Unix crypt(3) password hashing schemes (MD5-crypt, SHA-256-crypt, ...)"}
  SHA: {gap: generic-marker, primitive: hash, note: "a bare SHA (CipherRadar `Algorithm reference: SHA`, `HMAC-SHA`): SHA-1, SHA-2 or SHA-3 unspecified; a generic marker (generic_over) that attaches to the specific algorithms' clusters and never merges them"}
  XDH: {gap: generic-marker, primitive: key-agree, note: "Java's standard algorithm name for Diffie-Hellman over Curve25519 or Curve448 (KeyAgreement / KeyPairGenerator `XDH`, JDK 11): X25519 or X448 unspecified; a generic marker (generic_over) over those two"}

# What `parameterSetIdentifier` means per family (CycloneDX: "in AES128, '128' identifies the key length in bits, in
# SHA256, '256' identifies the digest length"). Families not listed: kept as `param_set` (raw), never as key size.
param:
  key: [AES, DES, 3DES, RSA, RSASSA-PKCS1, RSASSA-PSS, RSA-X931, RSAES-PKCS1, RSAES-OAEP, DSA, FFDH, ElGamal, Blowfish,
        RC2, RC4, RC5, RC6, IDEA, CAMELLIA, ARIA, SEED, SM4, Twofish, Serpent, CAST5, CAST6, Skipjack, ChaCha,
        ChaCha20, Salsa20]
  curve: [EC, ECDSA, ECDH, ECIES, SM2, MQV]
  digest: [SHA-1, SHA-2, SHA-3, MD2, MD4, MD5, RIPEMD, BLAKE2, BLAKE3, Whirlpool, SM3, SHA]

# The key sizes a NAME may state for a family (Vocabulary.plausible_key_size): a set, or a range with a step, by family
# or else by its group (RSA: the six RSA schemes; DH: FFDH, ElGamal, ...). A number next to a family token that is not
# in its set is left unmapped (`ISO7816-4Padding` is no AES key size, `issue_369_rsa_pem.pub` no RSA modulus). A
# keyed family without an entry takes any multiple of 8 between 8 and 16384 bits; a curve family a registry curve's
# size. A tool's own parameterSetIdentifier is never checked: what it writes is its finding (CBOMkit's AES-96).
key_sizes:
  AES: [128, 192, 256]                       # FIPS 197
  DES: [40, 56, 64]                          # FIPS 46-3 (64 with parity bits); 40: the export-grade DES40 of TLS suites (RFC 5246 A.5)
  3DES: [112, 168, 192]                      # SP 800-67 (two- and three-key TDEA; 192 with parity bits)
  Blowfish: {min: 32, max: 448, step: 8}     # Schneier 1993
  RC2: {min: 8, max: 1024, step: 8}          # RFC 2268
  RC4: {min: 40, max: 2048, step: 8}         # RFC 6229 (40 to 2048 bits)
  RC5: {min: 0, max: 2040, step: 8}          # RFC 2040
  RC6: [128, 192, 256]                       # AES candidate
  IDEA: [128]                                # RFC 3058
  CAST5: {min: 40, max: 128, step: 8}        # RFC 2144
  CAST6: [128, 160, 192, 224, 256]           # RFC 2612
  Twofish: [128, 192, 256]                   # AES candidate
  Serpent: [128, 192, 256]                   # AES candidate
  CAMELLIA: [128, 192, 256]                  # RFC 3713
  ARIA: [128, 192, 256]                      # RFC 5794
  SEED: [128]                                # RFC 4269
  SM4: [128]                                 # GB/T 32907-2016
  Skipjack: [80]                             # FIPS 185
  ChaCha20: [256]                            # RFC 8439
  Salsa20: [128, 256]                        # Bernstein 2008
  ChaCha: [128, 256]                         # the group (ChaCha, Poly1305)
  RSA: {min: 512, max: 16384, step: 8}       # the RSA group: a modulus length (FIPS 186-5 asks 2048 or more; 512 is the historic floor)
  DSA: [512, 768, 1024, 2048, 3072]          # FIPS 186-2 (512..1024 by 64, the usual ones) and FIPS 186-4 (1024, 2048, 3072)
  DH: {min: 512, max: 16384, step: 8}        # the DH group (FFDH, ElGamal, SRP, ...): a modulus length (RFC 7919 groups 2048..8192)

# The parameters a primitive HAS (Vocabulary.admitted; CycloneDX 1.7 primitive names). A value our own reading gives
# a record (a name parse, an API context, a derivation) for a parameter its primitive does not have is dropped
# (analysis/normalize/engine.py:_admit): a hash takes no key size, mode, padding or curve, so the 128 and GCM of
# `TLS_AES_128_GCM_SHA256` stay off a tool's SHA-2 component and `ES512` on one gives it no curve. A tool's own field
# or label is never dropped (what it writes is its finding). Primitives not listed admit every parameter.
admits:
  hash: []
  xof: []
  drbg: []
  mac: [digest, key_size]
  kdf: [digest, key_size, iterations]        # key_size: the derived key's length
  block-cipher: [key_size, mode, padding]
  stream-cipher: [key_size]
  ae: [key_size, mode, digest]               # digest: an encrypt-then-MAC composite (Fernet, JOSE A128CBC-HS256)
  key-wrap: [key_size, mode]
  signature: [key_size, curve, digest, padding]   # padding: the RSA signature schemes (PSS, PKCS1v15)
  pke: [key_size, curve, padding, digest]         # digest: OAEP's hash; EC without a scheme: its curve
  key-agree: [key_size, curve, digest]            # digest: ECDH with a KDF (`curve25519-sha256`)
  kem: [key_size]

# Specific variants inside a family. `aliases` are extra spellings (case and separators never matter);
# `hash: true` marks hash functions, which become the `digest` of a composite (HMAC-SHA-256, SHA256withECDSA).
algorithms:
  SHA-1: {family: SHA-1, hash: true, aliases: [SHA1, SHA-160]}
  SHA-224: {family: SHA-2, hash: true, aliases: [SHA224, SHA2-224]}
  SHA-256: {family: SHA-2, hash: true, aliases: [SHA256, SHA2-256]}
  SHA-384: {family: SHA-2, hash: true, aliases: [SHA384, SHA2-384]}
  SHA-512: {family: SHA-2, hash: true, aliases: [SHA512, SHA2-512]}
  SHA-512/224: {family: SHA-2, hash: true, aliases: [SHA512-224, SHA-512-224]}
  SHA-512/256: {family: SHA-2, hash: true, aliases: [SHA512-256, SHA-512-256]}
  SHA-2: {family: SHA-2, hash: true, aliases: [SHA2]}
  SHA3-224: {family: SHA-3, hash: true, aliases: [SHA3_224]}
  SHA3-256: {family: SHA-3, hash: true, aliases: [SHA3_256]}
  SHA3-384: {family: SHA-3, hash: true, aliases: [SHA3_384]}
  SHA3-512: {family: SHA-3, hash: true, aliases: [SHA3_512]}
  SHA-3: {family: SHA-3, hash: true, aliases: [SHA3]}
  SHA: {family: SHA, hash: true}   # generic: which SHA is unspecified (never SHA-1 by default)
  XDH: {family: XDH}               # generic: X25519 or X448 unspecified (Java standard name)
  SHAKE128: {family: SHA-3, hash: true, primitive: xof}
  SHAKE256: {family: SHA-3, hash: true, primitive: xof}
  SHAKE: {family: SHA-3, hash: true, primitive: xof}
  MD2: {family: MD2, hash: true}
  MD4: {family: MD4, hash: true}
  MD5: {family: MD5, hash: true}
  RIPEMD-160: {family: RIPEMD, hash: true, aliases: [RIPEMD160, RMD160]}
  BLAKE2b: {family: BLAKE2, hash: true, aliases: [BLAKE2B]}
  BLAKE2s: {family: BLAKE2, hash: true}
  BLAKE2: {family: BLAKE2, hash: true}
  BLAKE3: {family: BLAKE3, hash: true}
  Whirlpool: {family: Whirlpool, hash: true}
  SM3: {family: SM3, hash: true}
  Ed25519: {family: EdDSA, curve: Ed25519, aliases: [PureEd25519, Ed25519ph, Ed25519ctx]}
  Ed448: {family: EdDSA, curve: Ed448, aliases: [Ed448ph]}
  X25519: {family: ECDH, curve: Curve25519}
  X448: {family: ECDH, curve: Curve448}
  ML-KEM-512: {family: ML-KEM, param_set: "512", aliases: [MLKEM512, Kyber512]}
  ML-KEM-768: {family: ML-KEM, param_set: "768", aliases: [MLKEM768, Kyber768]}
  ML-KEM-1024: {family: ML-KEM, param_set: "1024", aliases: [MLKEM1024, Kyber1024]}
  ML-DSA-44: {family: ML-DSA, param_set: "44", aliases: [MLDSA44, Dilithium2]}
  ML-DSA-65: {family: ML-DSA, param_set: "65", aliases: [MLDSA65, Dilithium3]}
  ML-DSA-87: {family: ML-DSA, param_set: "87", aliases: [MLDSA87, Dilithium5]}
  sntrup761: {family: NTRU-Prime, aliases: [SNTRUP761, sntrup761x25519-sha512]}
  ChaCha20-Poly1305: {family: ChaCha20, primitive: ae, aliases: [ChaCha20Poly1305, CHACHA20_POLY1305]}
  XChaCha20-Poly1305: {family: ChaCha20, primitive: ae}
  XChaCha20: {family: ChaCha20}
  XSalsa20-Poly1305: {family: Salsa20, primitive: ae, aliases: [NaCl-SecretBox, secretbox]}
  Argon2id: {family: Argon2}
  Argon2i: {family: Argon2}
  Argon2d: {family: Argon2}
  TOTP: {family: HMAC}
  HOTP: {family: HMAC}
  SHA1PRNG: {family: CSPRNG}
  MGF1: {family: null, secondary: true, note: "mask generation function of OAEP/PSS; only used when a name has nothing else"}

# Extra spellings of families (registry and addition names are recognised as themselves).
families:
  3DES: [DESede, TripleDES, TDEA, TDES, 3DES-EDE, DES-EDE3, DESede-EDE, Triple-DES, DES3]   # DES3: pycryptodome's module Crypto.Cipher.DES3
  EC: [ECC, elliptic, EllipticCurve, elliptic-curve]
  FFDH: [DH, DHE, Diffie-Hellman, DiffieHellman, FFDHE]
  ECDH: [ECDHE, ECDH-ES]
  EdDSA: [Ed-DSA]
  RSASSA-PKCS1: [RSASSA-PKCS1-v1_5, RSASSA-PKCS1-v1-5, RSASSA-PKCS1v15]
  RSASSA-PSS: [RSA-PSS, RSAPSS]
  RSAES-OAEP: [RSA-OAEP, RSAOAEP]
  RSAES-PKCS1: [RSAES-PKCS1-v1_5]
  ChaCha20: [CHACHA20, ChaCha-20]
  Blowfish: [BF]
  RC4: [ARCFOUR, ARC4, Arcfour]
  CAMELLIA: [Camellia]
  Whirlpool: [WHIRLPOOL]
  bcrypt: [BCRYPT, bcrypt_pbkdf]
  scrypt: [SCRYPT]
  HKDF: [HKDF]
  SP800-56C: [ConcatenationKDF, ConcatKDF, Concat-KDF]
  CSPRNG: [DRBG, SecureRandom, CSPRNG, csprng]
  PRNG: [insecure-random, weak-random, PRNG]   # a bare `rand` is ambiguous (C rand() vs OpenSSL RAND): unmapped
  ML-KEM: [MLKEM, Kyber, ML_KEM]
  ML-DSA: [MLDSA, Dilithium, ML_DSA]
  SLH-DSA: [SLHDSA, SPHINCS, SPHINCS+, SPHINCSPlus]
  FN-DSA: [Falcon]
  Hybrid-KEM: [hybrid]
  NTRU-Prime: [Streamlined NTRU Prime, sntrup]   # the scheme's name (NIST PQC round 3 submission); CBOMkit writes it
  ANSI-KDF: [X963KDF, X9.63-KDF, ANSI-X9.63-KDF, ANSI-KDF-X9.63, KDF-X9.63]   # ANSI X9.63 KDF: pyca's x963kdf.X963KDF; CBOMkit's ANSI-KDF-X9.63; the registry's ANSI-KDF-X9.63 pattern

# What a record implies about other algorithms (CLAUDE.md refinement 2): some tools expand such hierarchies (CBOMkit
# lists SHA-256 next to HMAC-SHA256), others do not, so without this an expanding tool looks "exclusive" by
# construction. Applied as an optional closure of a tool's per-repository set (`--closure` in `levels`/`report`;
# matchers and scoring report both). Two generic rules live in the code (Vocabulary.implied): a record's `digest`
# implies that hash algorithm (HMAC-SHA256 -> SHA-256, SHA256withECDSA -> SHA-256), and an algorithm implies its
# family. This table adds what a name does not spell out; protocols never imply cipher suites unless the record
# names them.
implies:
  PBKDF2: [HMAC]
  PBES2: [PBKDF2, HMAC]
  PBES1: [PBKDF1]
  TOTP: [HMAC]
  HOTP: [HMAC]
  Ed25519: [SHA-512]
  Ed448: [SHAKE256]
  ECIES: [ECDH]
  X25519MLKEM768: [X25519, ML-KEM-768]

# Generic markers: a name that stands for several families at once. Such a record is attached to the clusters of the
# specific algorithms present in the repository and never merges them (analysis/levels.py); a more specific value of
# the same record refines it instead of conflicting (Vocabulary.relation).
generic_over:
  SHA: [SHA-1, SHA-2, SHA-3]
  XDH: [X25519, X448]   # algorithms, not families: XDH never stands for all of ECDH

# OIDs read in names (`OID(1.2.840.113549.1.1.1)`, `ec-1.2.840.10045.3.1.7.p12`) and from the `oid` field (a gap
# filler, `derived:oid`); the registry's curve OIDs are read from analysis/data/cyclonedx/cryptography-defs.json and
# need no entry. Each line names its source.
oids:
  1.2.840.113549.1.1.1: {family: RSA}                            # rsaEncryption, RFC 8017 A.1
  1.2.840.113549.1.1.5: {family: RSASSA-PKCS1, digest: SHA-1}    # sha1WithRSAEncryption, RFC 8017 A.2.4
  1.2.840.113549.1.1.14: {family: RSASSA-PKCS1, digest: SHA-224} # sha224WithRSAEncryption
  1.2.840.113549.1.1.11: {family: RSASSA-PKCS1, digest: SHA-256} # sha256WithRSAEncryption
  1.2.840.113549.1.1.12: {family: RSASSA-PKCS1, digest: SHA-384} # sha384WithRSAEncryption
  1.2.840.113549.1.1.13: {family: RSASSA-PKCS1, digest: SHA-512} # sha512WithRSAEncryption
  1.2.840.113549.1.1.10: {family: RSASSA-PSS}                    # id-RSASSA-PSS, RFC 8017 A.2.3
  1.2.840.113549.1.1.7: {family: RSAES-OAEP}                     # id-RSAES-OAEP, RFC 8017 A.2.1
  1.2.840.10045.2.1: {family: EC}                                # id-ecPublicKey, RFC 5480 2.1.1
  1.2.840.10045.4.1: {family: ECDSA, digest: SHA-1}              # ecdsa-with-SHA1, RFC 5480 / RFC 5758
  1.2.840.10045.4.3.1: {family: ECDSA, digest: SHA-224}          # ecdsa-with-SHA224
  1.2.840.10045.4.3.2: {family: ECDSA, digest: SHA-256}          # ecdsa-with-SHA256
  1.2.840.10045.4.3.3: {family: ECDSA, digest: SHA-384}          # ecdsa-with-SHA384
  1.2.840.10045.4.3.4: {family: ECDSA, digest: SHA-512}          # ecdsa-with-SHA512
  1.2.840.10040.4.1: {family: DSA}                               # id-dsa, RFC 3279 2.3.2
  1.2.840.10040.4.3: {family: DSA, digest: SHA-1}                # dsa-with-sha1, RFC 3279 2.2.2
  1.2.840.10046.2.1: {family: FFDH}                              # dhpublicnumber, RFC 3279 2.3.3
  1.3.101.110: {algorithm: X25519}                               # id-X25519, RFC 8410 3
  1.3.101.111: {algorithm: X448}                                 # id-X448
  1.3.101.112: {algorithm: Ed25519}                              # id-Ed25519
  1.3.101.113: {algorithm: Ed448}                                # id-Ed448
  1.3.14.3.2.26: {algorithm: SHA-1}                              # id-sha1, RFC 3370 2.1
  1.2.840.113549.2.5: {algorithm: MD5}                           # md5, RFC 3370 2.2
  2.16.840.1.101.3.4.2.4: {algorithm: SHA-224}                   # id-sha224, RFC 5754 2
  2.16.840.1.101.3.4.2.1: {algorithm: SHA-256}                   # id-sha256
  2.16.840.1.101.3.4.2.2: {algorithm: SHA-384}                   # id-sha384
  2.16.840.1.101.3.4.2.3: {algorithm: SHA-512}                   # id-sha512
  1.2.840.113549.2.7: {family: HMAC, digest: SHA-1}              # hmacWithSHA1, RFC 8018 B.1.1
  1.2.840.113549.2.9: {family: HMAC, digest: SHA-256}            # hmacWithSHA256
  1.2.840.113549.2.10: {family: HMAC, digest: SHA-384}           # hmacWithSHA384
  1.2.840.113549.2.11: {family: HMAC, digest: SHA-512}           # hmacWithSHA512
  2.16.840.1.101.3.4.1.2: {family: AES}                          # id-aes128-CBC, RFC 3565 (the key size is the name's: aes128)
  2.16.840.1.101.3.4.1.6: {family: AES}                          # id-aes128-GCM, RFC 5084
  2.16.840.1.101.3.4.1.22: {family: AES}                         # id-aes192-CBC
  2.16.840.1.101.3.4.1.26: {family: AES}                         # id-aes192-GCM
  2.16.840.1.101.3.4.1.42: {family: AES}                         # id-aes256-CBC
  2.16.840.1.101.3.4.1.46: {family: AES}                         # id-aes256-GCM
  1.2.840.113549.1.5.12: {family: PBKDF2}                        # id-PBKDF2, RFC 8018 A.2
  1.2.840.113549.1.5.13: {family: PBES2}                         # id-PBES2, RFC 8018 A.4

curves:   # extra spellings; the registry's OID-equal names are aliases already
  secp256r1: [nistp256, NIST-P-256, P256, prime-256-v1]
  secp384r1: [nistp384, NIST-P-384, P384]
  secp521r1: [nistp521, NIST-P-521, P521]
  secp224r1: [nistp224, P224]
  Ed25519: [Edwards25519, edwards-25519]
  Ed448: [Edwards448, edwards-448]
  Curve25519: [X25519, curve-25519]
  Curve448: [X448]

modes:
  ECB: []
  CBC: []
  CFB: [CFB1, CFB8, CFB64, CFB128]
  OFB: []
  CTR: []
  GCM: []
  CCM: [CCM8, CCM-8]
  XTS: []
  CTS: []
  KW: [Wrap, KeyWrap]
  KWP: [KeyWrapPad, WrapPad]
  OCB: [OCB3]   # RFC 7253 names the mode OCB3; pyca's AESOCB3
  SIV: []
  GCM-SIV: [GCMSIV]
  EAX: []

paddings:
  NONE: [NoPadding, raw, none]
  PKCS5: [PKCS5Padding, PKCS-5]
  PKCS7: [PKCS7Padding, PKCS-7]
  PKCS1v15: [PKCS1, PKCS1Padding, PKCS1-1.5, PKCS1v1.5, PKCS1-v1_5, PKCS1-v1-5, PKCS-1]
  OAEP: [OAEPPadding]
  PSS: [PSSPadding]
  ISO10126: [ISO10126Padding]
  X923: [X9.23, X923Padding]
  ZERO: [ZeroPadding, ZeroBytePadding]
  ISO7816-4: [ISO7816-4Padding, ISO7816d4Padding, ISO7816]   # ISO/IEC 7816-4 padding: JCA's ISO7816-4Padding, BouncyCastle's ISO7816d4Padding

primitives:   # CycloneDX 1.7 enum values (1.6 lacks key-wrap); `other` and `unknown` carry no information
  drbg: []
  mac: []
  block-cipher: [blockcipher, block_cipher, blockCipher]
  stream-cipher: [streamcipher, stream_cipher, streamCipher]
  signature: [sig]
  hash: [digest, hashing]
  pke: [public-key-encryption, asymmetric-encryption]
  xof: []
  kdf: []
  key-agree: [keyagree, key-agreement, keyagreement, keyexchange, key-exchange, kex]
  kem: []
  ae: [aead, authenticated-encryption]
  combiner: []
  key-wrap: [keywrap, key_wrap]

functions:    # CycloneDX cryptoFunctions enum values
