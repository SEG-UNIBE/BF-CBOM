# Snippet catalog for Go insertion mutants (Phase 4; loader mutation/catalog.py, format in java.yaml's header).
#
# Everything is standard library except PBKDF2 on modules older than Go 1.24: its first form is `crypto/pbkdf2`
# (`go >= 1.24` in the module's go.mod), the second `golang.org/x/crypto/pbkdf2` where go.mod already requires
# golang.org/x/crypto; a module meeting neither gets no PBKDF2 mutant (go.mod is never edited, decided 2026-10-20).
# Go rejects unused variables and imports, so every snippet uses what it declares; the host's results are unknown, so
# errors panic. Inside a host the snippet sits in its own block (`scope`), so its locals never clash with the host's.
# Go's APIs take no algorithm strings: `indirect` holds a parameter or a function value in a variable instead.
# The micro project corpus/micro/go is generated from this catalog (mutation/micro.py; AI-made, on the human-review
# list before paper use).
version: "2026-10-20.1"
language: go
scope: |
  {
      $body
  }

snippets:
  - id: rsa-2048-keygen
    expected: {unit: RSA, family: RSA, key_size: 2048}
    also: [CSPRNG]
    helper: generateRSAKey
    imports: [crypto/rand, crypto/rsa]
    direct: |
      $key, $err := $rsa.GenerateKey($rand.Reader, 2048) @call
      if $err != nil {
          panic($err)
      }
      _ = $key
    indirect: |
      $bits := 2048 @related
      $key, $err := $rsa.GenerateKey($rand.Reader, $bits) @call
      if $err != nil {
          panic($err)
      }
      _ = $key

  - id: ec-p256-keygen
    expected: {unit: ECDSA, family: ECDSA, curve: secp256r1}
    also: [CSPRNG]
    helper: generateECKey
    imports: [crypto/ecdsa, crypto/elliptic, crypto/rand]
    direct: |
      $key, $err := $ecdsa.GenerateKey($elliptic.P256(), $rand.Reader) @call
      if $err != nil {
          panic($err)
      }
      _ = $key
    indirect: |
      $curve := $elliptic.P256() @related
      $key, $err := $ecdsa.GenerateKey($curve, $rand.Reader) @call
      if $err != nil {
          panic($err)
      }
      _ = $key

  - id: ecdsa-p256-sign
    expected: {unit: ECDSA, family: ECDSA, digest: SHA-256}
    also: [CSPRNG, SHA-256]
    helper: signWithECDSA
    imports: [crypto/ecdsa, crypto/elliptic, crypto/rand, crypto/sha256]
    direct: |
      $key, $err := $ecdsa.GenerateKey($elliptic.P256(), $rand.Reader)
      if $err != nil {
          panic($err)
      }
      $digest := $sha256.Sum256([]byte("data"))
      $signature, $err := $ecdsa.SignASN1($rand.Reader, $key, $digest[:]) @call
      if $err != nil {
          panic($err)
      }
      _ = $signature
    indirect: |
      $sum := $sha256.Sum256 @related
      $key, $err := $ecdsa.GenerateKey($elliptic.P256(), $rand.Reader)
      if $err != nil {
          panic($err)
      }
      $digest := $sum([]byte("data"))
      $signature, $err := $ecdsa.SignASN1($rand.Reader, $key, $digest[:]) @call
      if $err != nil {
          panic($err)
      }
      _ = $signature

  - id: ed25519-sign
    expected: {unit: Ed25519, family: EdDSA}
    also: [CSPRNG]
    helper: signWithEd25519
    imports: [crypto/ed25519, crypto/rand]
    direct: |
      _, $priv, $err := $ed25519.GenerateKey($rand.Reader)
      if $err != nil {
          panic($err)
      }
      $signature := $ed25519.Sign($priv, []byte("data")) @call
      _ = $signature
    indirect: |
      $sign := $ed25519.Sign @related
      _, $priv, $err := $ed25519.GenerateKey($rand.Reader)
      if $err != nil {
          panic($err)
      }
      $signature := $sign($priv, []byte("data")) @call
      _ = $signature

  - id: aes-128-gcm
    expected: {unit: AES, family: AES, key_size: 128, mode: GCM}
    helper: encryptWithAESGCM
    imports: [crypto/aes, crypto/cipher]
    direct: |
      $block, $err := $aes.NewCipher(make([]byte, 16)) @call
      if $err != nil {
          panic($err)
      }
      $gcm, $err := $cipher.NewGCM($block)
      if $err != nil {
          panic($err)
      }
      $ciphertext := $gcm.Seal(nil, make([]byte, $gcm.NonceSize()), []byte("data"), nil)
      _ = $ciphertext
    indirect: |
      $keySize := 16 @related
      $block, $err := $aes.NewCipher(make([]byte, $keySize)) @call
      if $err != nil {
          panic($err)
      }
      $gcm, $err := $cipher.NewGCM($block)
      if $err != nil {
          panic($err)
      }
      $ciphertext := $gcm.Seal(nil, make([]byte, $gcm.NonceSize()), []byte("data"), nil)
      _ = $ciphertext

  - id: aes-256-gcm
    expected: {unit: AES, family: AES, key_size: 256, mode: GCM}
    helper: encryptWithAESGCM
    imports: [crypto/aes, crypto/cipher]
    direct: |
      $block, $err := $aes.NewCipher(make([]byte, 32)) @call
