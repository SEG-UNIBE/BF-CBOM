  - id: aes-256-cbc
    expected: {unit: AES, family: AES, key_size: 256, mode: CBC}
    helper: encryptWithAESCBC
    imports: [crypto/aes, crypto/cipher]
    direct: |
      $block, $err := $aes.NewCipher(make([]byte, 32)) @call
      if $err != nil {
          panic($err)
      }
      $mode := $cipher.NewCBCEncrypter($block, make([]byte, $aes.BlockSize))
      $ciphertext := make([]byte, $aes.BlockSize)
      $mode.CryptBlocks($ciphertext, make([]byte, $aes.BlockSize))
    indirect: |
      $newMode := $cipher.NewCBCEncrypter @related
      $block, $err := $aes.NewCipher(make([]byte, 32)) @call
      if $err != nil {
          panic($err)
      }
      $mode := $newMode($block, make([]byte, $aes.BlockSize))
      $ciphertext := make([]byte, $aes.BlockSize)
      $mode.CryptBlocks($ciphertext, make([]byte, $aes.BlockSize))

  - id: 3des-cbc
    expected: {unit: 3DES, family: 3DES, mode: CBC}
    helper: encryptWithTripleDES
    imports: [crypto/cipher, crypto/des]
    direct: |
      $block, $err := $des.NewTripleDESCipher(make([]byte, 24)) @call
      if $err != nil {
          panic($err)
      }
      $mode := $cipher.NewCBCEncrypter($block, make([]byte, $des.BlockSize))
      $ciphertext := make([]byte, $des.BlockSize)
      $mode.CryptBlocks($ciphertext, make([]byte, $des.BlockSize))
    indirect: |
      $newBlock := $des.NewTripleDESCipher @related
      $block, $err := $newBlock(make([]byte, 24)) @call
      if $err != nil {
          panic($err)
      }
      $mode := $cipher.NewCBCEncrypter($block, make([]byte, $des.BlockSize))
      $ciphertext := make([]byte, $des.BlockSize)
      $mode.CryptBlocks($ciphertext, make([]byte, $des.BlockSize))

  - id: rsa-oaep-sha256
    expected: {unit: RSAES-OAEP, family: RSAES-OAEP, padding: OAEP, digest: SHA-256}
    also: [RSA, CSPRNG, SHA-256]
    helper: encryptWithRSAOAEP
    imports: [crypto/rand, crypto/rsa, crypto/sha256]
    direct: |
      $key, $err := $rsa.GenerateKey($rand.Reader, 2048)
      if $err != nil {
          panic($err)
      }
      $ciphertext, $err := $rsa.EncryptOAEP($sha256.New(), $rand.Reader, &$key.PublicKey, []byte("data"), nil) @call
      if $err != nil {
          panic($err)
      }
      _ = $ciphertext
    indirect: |
      $newHash := $sha256.New @related
      $key, $err := $rsa.GenerateKey($rand.Reader, 2048)
      if $err != nil {
          panic($err)
      }
      $ciphertext, $err := $rsa.EncryptOAEP($newHash(), $rand.Reader, &$key.PublicKey, []byte("data"), nil) @call
      if $err != nil {
          panic($err)
      }
      _ = $ciphertext

  - id: sha-1
    expected: {unit: SHA-1, family: SHA-1}
    helper: sha1Digest
    imports: [crypto/sha1]
    direct: |
      $digest := $sha1.Sum([]byte("data")) @call
      _ = $digest
    indirect: |
      $sum := $sha1.Sum @related
      $digest := $sum([]byte("data")) @call
      _ = $digest

  - id: sha-256
    expected: {unit: SHA-256, family: SHA-2}
    helper: sha256Digest
    imports: [crypto/sha256]
    direct: |
      $digest := $sha256.Sum256([]byte("data")) @call
      _ = $digest
    indirect: |
      $sum := $sha256.Sum256 @related
      $digest := $sum([]byte("data")) @call
      _ = $digest

  - id: md5
    expected: {unit: MD5, family: MD5}
    helper: md5Digest
    imports: [crypto/md5]
    direct: |
      $digest := $md5.Sum([]byte("data")) @call
      _ = $digest
    indirect: |
      $sum := $md5.Sum @related
      $digest := $sum([]byte("data")) @call
      _ = $digest

  - id: hmac-sha256
    expected: {unit: HMAC, family: HMAC, digest: SHA-256}
    also: [SHA-256]
    helper: hmacSHA256
    imports: [crypto/hmac, crypto/sha256]
    direct: |
      $mac := $hmac.New($sha256.New, []byte("key")) @call
      $mac.Write([]byte("data"))
      $tag := $mac.Sum(nil)
      _ = $tag
    indirect: |
      $newHash := $sha256.New @related
      $mac := $hmac.New($newHash, []byte("key")) @call
      $mac.Write([]byte("data"))
      $tag := $mac.Sum(nil)
      _ = $tag

  - id: pbkdf2-hmac-sha256
    expected: {unit: PBKDF2, family: PBKDF2, digest: SHA-256, iterations: 600000}
    also: [SHA-256]
    helper: deriveKeyWithPBKDF2
    forms:
      - requires: {go: "1.24"}
        imports: [crypto/pbkdf2, crypto/sha256]
        direct: |
          $derivedKey, $err := $pbkdf2.Key($sha256.New, "changeit", make([]byte, 16), 600000, 32) @call
          if $err != nil {
              panic($err)
          }
          _ = $derivedKey
        indirect: |
          $newHash := $sha256.New @related
          $derivedKey, $err := $pbkdf2.Key($newHash, "changeit", make([]byte, 16), 600000, 32) @call
          if $err != nil {
              panic($err)
          }
          _ = $derivedKey
      - requires: {golang.org/x/crypto: ""}
        imports: [crypto/sha256, golang.org/x/crypto/pbkdf2]
        direct: |
          $derivedKey := $pbkdf2.Key([]byte("changeit"), make([]byte, 16), 600000, 32, $sha256.New) @call
          _ = $derivedKey
        indirect: |
          $newHash := $sha256.New @related
          $derivedKey := $pbkdf2.Key([]byte("changeit"), make([]byte, 16), 600000, 32, $newHash) @call
          _ = $derivedKey

  - id: tls13-context
    expected: {unit: null, protocol: TLS, protocol_version: "1.3"}
    helper: newTLSConfig
    imports: [crypto/tls]
    direct: |
      $config := &$tls.Config{MinVersion: $tls.VersionTLS13} @call
      _ = $config
    indirect: |
      var $minVersion uint16 = $tls.VersionTLS13 @related
      $config := &$tls.Config{MinVersion: $minVersion} @call
      _ = $config
