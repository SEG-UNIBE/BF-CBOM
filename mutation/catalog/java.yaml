# Snippet catalog for Java insertion mutants (Phase 4; loader mutation/catalog.py, format in experiments/README.md).
#
# Every snippet is JCA (java.security, javax.crypto, javax.net.ssl), which ships with the JDK, so every snippet fits every
# Java project. The micro project experiments/corpus/micro/java is generated from this catalog (mutation/micro.py; AI-made,
# on the human-review list before paper use).
# `expected` is the snippet's canonical record in the normaliser's vocabulary (unit = the L4 identity of
# analysis/levels.py), `also` the identities the snippet necessarily contains besides it. Templates: `$name` is an
# import (its simple name, or the fully qualified one on a clash) or a local (renamed on a clash); a trailing `@call`
# marks the line naming the algorithm, `@related` the line holding it in a variable (both stripped). Four spaces are
# one indentation level (re-indented to the file's own). `wrapper` is derived from `direct` (mutation/insert.py).
# Changing a snippet bumps `version`: every mutant records the version it was made from (mutants.json).
version: "2026-10-20.1"
language: java
wrap: |
  try {
      $body
  } catch ($GeneralSecurityException $e) {
      throw new IllegalStateException($e);
  }
wrap_imports: [java.security.GeneralSecurityException]

snippets:
  - id: rsa-2048-keygen
    expected: {unit: RSA, family: RSA, key_size: 2048}
    helper: generateRsaKeyPair
    imports: [java.security.KeyPair, java.security.KeyPairGenerator]
    direct: |
      $KeyPairGenerator $rsaGen = $KeyPairGenerator.getInstance("RSA"); @call
      $rsaGen.initialize(2048);
      $KeyPair $rsaKeys = $rsaGen.generateKeyPair();
    indirect: |
      String $keyAlgorithm = "RSA"; @related
      $KeyPairGenerator $rsaGen = $KeyPairGenerator.getInstance($keyAlgorithm); @call
      $rsaGen.initialize(2048);
      $KeyPair $rsaKeys = $rsaGen.generateKeyPair();

  - id: ec-p256-keygen
    expected: {unit: EC, family: EC, curve: secp256r1}
    helper: generateEcKeyPair
    imports: [java.security.KeyPair, java.security.KeyPairGenerator, java.security.spec.ECGenParameterSpec]
    direct: |
      $KeyPairGenerator $ecGen = $KeyPairGenerator.getInstance("EC"); @call
      $ecGen.initialize(new $ECGenParameterSpec("secp256r1"));
      $KeyPair $ecKeys = $ecGen.generateKeyPair();
    indirect: |
      String $keyAlgorithm = "EC"; @related
      $KeyPairGenerator $ecGen = $KeyPairGenerator.getInstance($keyAlgorithm); @call
      $ecGen.initialize(new $ECGenParameterSpec("secp256r1"));
      $KeyPair $ecKeys = $ecGen.generateKeyPair();

  - id: ecdsa-p256-sign
    expected: {unit: ECDSA, family: ECDSA, digest: SHA-256}
    also: [EC]
    helper: signWithEcdsa
    imports: [java.security.KeyPairGenerator, java.security.Signature, java.security.spec.ECGenParameterSpec]
    direct: |
      $KeyPairGenerator $ecGen = $KeyPairGenerator.getInstance("EC");
      $ecGen.initialize(new $ECGenParameterSpec("secp256r1"));
      $Signature $signer = $Signature.getInstance("SHA256withECDSA"); @call
      $signer.initSign($ecGen.generateKeyPair().getPrivate());
      $signer.update(new byte[32]);
      byte[] $signature = $signer.sign();
    indirect: |
      String $signatureAlgorithm = "SHA256withECDSA"; @related
      $KeyPairGenerator $ecGen = $KeyPairGenerator.getInstance("EC");
      $ecGen.initialize(new $ECGenParameterSpec("secp256r1"));
      $Signature $signer = $Signature.getInstance($signatureAlgorithm); @call
      $signer.initSign($ecGen.generateKeyPair().getPrivate());
      $signer.update(new byte[32]);
      byte[] $signature = $signer.sign();

