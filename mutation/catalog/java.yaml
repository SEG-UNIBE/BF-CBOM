  - id: hmac-sha256
    expected: {unit: HMAC, family: HMAC, digest: SHA-256}
    helper: hmacSha256
    imports: [javax.crypto.Mac, javax.crypto.spec.SecretKeySpec]
    direct: |
      $Mac $mac = $Mac.getInstance("HmacSHA256"); @call
      $mac.init(new $SecretKeySpec(new byte[32], "HmacSHA256"));
      byte[] $tag = $mac.doFinal(new byte[32]);
    indirect: |
      String $macAlgorithm = "HmacSHA256"; @related
      $Mac $mac = $Mac.getInstance($macAlgorithm); @call
      $mac.init(new $SecretKeySpec(new byte[32], $macAlgorithm));
      byte[] $tag = $mac.doFinal(new byte[32]);

  - id: pbkdf2-hmac-sha256
    expected: {unit: PBKDF2, family: PBKDF2, digest: SHA-256, iterations: 600000}
    helper: deriveKeyWithPbkdf2
    imports: [javax.crypto.SecretKeyFactory, javax.crypto.spec.PBEKeySpec]
    direct: |
      $SecretKeyFactory $factory = $SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256"); @call
      $PBEKeySpec $keySpec = new $PBEKeySpec("changeit".toCharArray(), new byte[16], 600000, 256);
      byte[] $derivedKey = $factory.generateSecret($keySpec).getEncoded();
    indirect: |
      String $kdfAlgorithm = "PBKDF2WithHmacSHA256"; @related
      $SecretKeyFactory $factory = $SecretKeyFactory.getInstance($kdfAlgorithm); @call
