  - id: rsa-oaep-sha256
    expected: {unit: RSAES-OAEP, family: RSAES-OAEP, padding: OAEP, digest: SHA-256}
    also: [RSA]
    helper: encryptWithRsaOaep
    imports: [java.security.KeyPairGenerator, javax.crypto.Cipher]
    direct: |
      $KeyPairGenerator $rsaGen = $KeyPairGenerator.getInstance("RSA");
      $rsaGen.initialize(2048);
      $Cipher $cipher = $Cipher.getInstance("RSA/ECB/OAEPWithSHA-256AndMGF1Padding"); @call
      $cipher.init($Cipher.ENCRYPT_MODE, $rsaGen.generateKeyPair().getPublic());
      byte[] $ciphertext = $cipher.doFinal(new byte[32]);
    indirect: |
      String $transformation = "RSA/ECB/OAEPWithSHA-256AndMGF1Padding"; @related
      $KeyPairGenerator $rsaGen = $KeyPairGenerator.getInstance("RSA");
      $rsaGen.initialize(2048);
      $Cipher $cipher = $Cipher.getInstance($transformation); @call
      $cipher.init($Cipher.ENCRYPT_MODE, $rsaGen.generateKeyPair().getPublic());
      byte[] $ciphertext = $cipher.doFinal(new byte[32]);

  - id: sha-1
    expected: {unit: SHA-1, family: SHA-1}
    helper: sha1Digest
    imports: [java.security.MessageDigest]
    direct: |
