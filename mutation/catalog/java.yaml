      $Signature $signer = $Signature.getInstance($signatureAlgorithm); @call
      $signer.initSign($edGen.generateKeyPair().getPrivate());
      $signer.update(new byte[32]);
      byte[] $signature = $signer.sign();

  - id: aes-128-gcm
    expected: {unit: AES, family: AES, key_size: 128, mode: GCM}
    helper: encryptWithAesGcm
    imports: [javax.crypto.Cipher, javax.crypto.KeyGenerator, javax.crypto.spec.GCMParameterSpec]
    direct: |
      $KeyGenerator $keyGen = $KeyGenerator.getInstance("AES");
      $keyGen.init(128);
      $Cipher $cipher = $Cipher.getInstance("AES/GCM/NoPadding"); @call
      $cipher.init($Cipher.ENCRYPT_MODE, $keyGen.generateKey(), new $GCMParameterSpec(128, new byte[12]));
      byte[] $ciphertext = $cipher.doFinal(new byte[16]);
    indirect: |
      String $transformation = "AES/GCM/NoPadding"; @related
      $KeyGenerator $keyGen = $KeyGenerator.getInstance("AES");
      $keyGen.init(128);
      $Cipher $cipher = $Cipher.getInstance($transformation); @call
      $cipher.init($Cipher.ENCRYPT_MODE, $keyGen.generateKey(), new $GCMParameterSpec(128, new byte[12]));
      byte[] $ciphertext = $cipher.doFinal(new byte[16]);

