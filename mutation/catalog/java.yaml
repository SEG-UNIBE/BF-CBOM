      byte[] $digest = $md.digest(new byte[32]);
    indirect: |
      String $digestAlgorithm = "SHA-1"; @related
      $MessageDigest $md = $MessageDigest.getInstance($digestAlgorithm); @call
      byte[] $digest = $md.digest(new byte[32]);

